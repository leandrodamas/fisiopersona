function salvarChamada() {
  var profId = _chamadaProf;
  var data   = _chamadaData;
  var existentes = ST.sessoes.filter(function(s){return s.data===data&&s.prof===profId;});
  var presencasAntes = {};
  existentes.forEach(function(s){ if(s.status==='P') presencasAntes[s.pid]=(presencasAntes[s.pid]||0)+1; });
  var delPromises = existentes.map(function(s){return sbDel('sessoes',s.id);});

  Promise.all(delPromises).then(function() {
    ST.sessoes = ST.sessoes.filter(function(s){return !(s.data===data&&s.prof===profId);});
    var insPromises = [];
    var presencasDepois = {};
    Object.keys(_chamadaSt).forEach(function(pid) {
      var st = _chamadaSt[pid];
      if(!st) return;
      var pac = ST.patients.find(function(p){return p.id===pid;});
      var nova = {id:'s'+uid(),pid:pid,prof:profId,data:data,status:st,est:(pac?pac.est:''),obs:_chamadaObs[pid]||''};
      insPromises.push(sbIns('sessoes',nova).then(function(){
        ST.sessoes.push(nova);
        if(st==='P') presencasDepois[pid]=(presencasDepois[pid]||0)+1;
      }));
    });
    return Promise.all(insPromises).then(function(){
      var pids = {};
      Object.keys(presencasAntes).forEach(function(pid){pids[pid]=true;});
      Object.keys(presencasDepois).forEach(function(pid){pids[pid]=true;});
      var updPromises = [];
      Object.keys(pids).forEach(function(pid){
        var antes = presencasAntes[pid]||0;
        var depois = presencasDepois[pid]||0;
        var delta = depois-antes;
        if(!delta) return;
        var pac = ST.patients.find(function(p){return p.id===pid;});
        if(!pac) return;
        var nr = Math.max(0,(parseInt(pac.real)||0)+delta);
        updPromises.push(sbUpd('pacientes',pid,{real:nr}).then(function(){
          ST.patients=ST.patients.map(function(p){return p.id===pid?Object.assign({},p,{real:nr}):p;});
        }));
      });
      return Promise.all(updPromises);
    });
  }).then(function(){
    closeDrawer(); toast('Chamada salva!'); renderAlerts(); go(ST.tab);
  }).catch(function(e){ toast('Erro: '+e.message, false); });
}


var _cidCompatFetchPromise = null;
var _cidPorCidMapNorm = {};
function normCidLookupKey(s){
  if(s==null) return '';
  return String(s).trim().replace(/\s+/g,'').replace(/,/g,'.').toUpperCase();
}
/** Gera variantes CID-10 (ex.: M54.5 ↔ M545) iguais ao gerador Python. */
function cidAlternateKeysForMap(k){
  if(!k) return [];
  var add={}, out=[];
  function a(x){ if(x&&!add[x]){ add[x]=true; out.push(x); } }
  a(k);
  var m=/^([A-TV-Z])(\d{2})\.(\d[\d]*)$/i.exec(k);
  if(m){
    var rest=String(m[3]).replace(/[^\d]/g,'');
    if(rest.length) a((m[1].toUpperCase()+m[2]+rest).toUpperCase());
  }
  var m2=/^([A-TV-Z])(\d{2})(\d[\d]*)$/i.exec(k);
  if(m2 && m2[3]) a((m2[1].toUpperCase()+m2[2]+'.'+m2[3]).toUpperCase());
  return out.length?out:[k];
}
/** Une porCid garantindo todas as variantes por tecla (lista deduplicada por codigo|descricao). */
function normalizePorCidAliases(rawPorCid){
  var agg={};
  function pushKey(keyStr,items){
    var key = normCidLookupKey(keyStr);
    if(!key) return;
    if(!agg[key]) agg[key]=[];
    var lst=agg[key];
    (Array.isArray(items)?items:[]).forEach(function(it){
      if(!it||(it.codigo==null&&!it.descricao)) return;
      var sig=String(it.codigo||'')+'\u0001'+String(it.descricao||'');
      var dup=false;
      for(var i=0;i<lst.length;i++){
        var x=lst[i];
        if(String(x.codigo||'')+'\u0001'+String(x.descricao||'')===sig){ dup=true; break; }
      }
      if(!dup) lst.push({ codigo:it.codigo, descricao:String(it.descricao||'') });
    });
  }
  Object.keys(rawPorCid||{}).forEach(function(orig){
    var items=rawPorCid[orig];
    var nk=normCidLookupKey(orig);
    cidAlternateKeysForMap(nk).forEach(function(ak){ pushKey(ak, items); });
  });
  return agg;
}
function fetchCidCompatMap(){
  if(_cidCompatFetchPromise) return _cidCompatFetchPromise;
  _cidCompatFetchPromise = fetch('data/cid_procedimento_compat.json').then(function(r){
    return r.ok ? r.json() : Promise.reject(new Error(String(r.status)));
  }).then(function(j){
    var raw = j.porCid || {};
    _cidPorCidMapNorm = normalizePorCidAliases(raw);
    return _cidPorCidMapNorm;
  }).catch(function(){
    _cidPorCidMapNorm = {};
    return _cidPorCidMapNorm;
  });
  return _cidCompatFetchPromise;
}
function cidCompatListFor(rawCid){
  var map = _cidPorCidMapNorm || {};
  var k = normCidLookupKey(rawCid);
  if(!k) return [];
  function get(key){
    var a = map[key];
    return Array.isArray(a)?a:[];
  }
  var cur = k;
  for(var guard=0;guard<12;guard++){
    var list = get(cur);
    if(list.length) return list;
    var dot = cur.lastIndexOf('.');
    if(dot<0) break;
    cur = cur.slice(0, dot);
  }
  return [];
}
function pacFormSetTab(idx){
  window._pacFormActiveTab = idx;
  var t0 = document.getElementById('pac-tab-btn-0'), t1 = document.getElementById('pac-tab-btn-1');
  var p0 = document.getElementById('pac-tab-panel-0'), p1 = document.getElementById('pac-tab-panel-1');
  var cor = window._pacFormAccent||'#0d9488';
  if(t0){ t0.style.border='1px solid '+(idx===0?cor:'#e2e8f0'); t0.style.background=(idx===0?(cor+'22'):'transparent'); t0.style.color=(idx===0?cor:'#64748b'); }
  if(t1){ t1.style.border='1px solid '+(idx===1?cor:'#e2e8f0'); t1.style.background=(idx===1?(cor+'22'):'transparent'); t1.style.color=(idx===1?cor:'#64748b'); }
  if(!p0||!p1) return;

  if(idx===1) fetchCidCompatMap().then(function(){ refreshPacProcedimentoPanel({}); });

function refreshPacProcedimentoPanel(opts){
  opts = opts||{};
  var sel = document.getElementById('f-cod-proc');
  var man = document.getElementById('f-cod-proc-man');
  var initEl = document.getElementById('f-cod-proc-init');
  var mirror = document.getElementById('pac-cid-mirror');
  var cidInp = document.getElementById('f-cid');
  if(!sel) return;
  var cidVal = cidInp ? String(cidInp.value||'') : '';
  if(mirror) mirror.textContent = normCidLookupKey(cidVal) || '\u2014';

  var savedInit = initEl ? String(initEl.value||'').trim() : '';
  var prevEffective = '';
  if(opts.fromInit) prevEffective = savedInit;
  else {
    var mNow = man ? String(man.value||'').trim() : '';
    var sNow = sel.selectedIndex>0 && sel.value ? String(sel.value).trim() : '';
    prevEffective = mNow || sNow;
  }

  var rows = cidCompatListFor(cidVal);
  sel.innerHTML = '';
  var opt0 = document.createElement('option');
  opt0.value = '';
  if(!normCidLookupKey(cidVal))
    opt0.textContent = 'Informe o CID-10 acima das abas para listar c\u00f3digos compat\u00edveis';
  else if(rows.length)
    opt0.textContent = 'Selecione um c\u00f3digo compat\u00edvel';
  else
    opt0.textContent = '(Nenhum c\u00f3digo no JSON para este CID \u2014 use Outro c\u00f3digo (livre) abaixo)';
  sel.appendChild(opt0);
  rows.forEach(function(it){
    var code = String(it&&it.codigo!=null ? it.codigo : '').trim();
    var desc = String(it&&it.descricao!=null ? it.descricao : '').trim();
    if(!code){
      /* descrição sozinha no value quebrava o PATCH (valor enorme ou inválido) — só listamos opções com código TUSS/SUS */
      return;
    }
    var o = document.createElement('option');
    o.value = code;
    o.textContent = (code||(desc||'')) + ((code&&desc&&desc!==code) ? (' \u2014 '+desc) : '');
    sel.appendChild(o);
  });

  var apply = String(prevEffective||'').trim();
  var foundIdx = -1;
  if(apply){
    for(var i=1;i<sel.options.length;i++){
      if(String(sel.options[i].value)===apply){ foundIdx=i; break; }
    }
  }
  if(foundIdx>=0){
    sel.selectedIndex = foundIdx;
    if(man) man.value = '';
  } else {
    sel.selectedIndex = 0;
    if(man) man.value = apply;
  }
  if(opts.fromInit){
    var i2=document.getElementById('f-cod-proc-init');
    if(i2) i2.value = '';
  }
}

  openDrawer('\u2795 Novo Paciente \u2014 '+est+' '+hor, buildFormPac(d, prof?prof.cor:'#0d9488'), prof?prof.cor:'#0d9488', paintPacFormTimeline);

function editPac(id) {

  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">';

  fields.forEach(function(f){
    h += '<div style="background:#f8fafc;border-radius:9px;padding:9px 11px">';
    h += '<div style="font-size:9px;color:#64748b;letter-spacing:1px">'+f[0].toUpperCase()+'</div>';
    h += '<div style="font-size:12px;color:#1e293b;margin-top:2px">'+esc(String(f[1]))+'</div>';
    h += '</div>';
  });
  h += '</div>';
  h += '<div style="background:#f8fafc;border-radius:10px;padding:12px;margin-bottom:12px">';
  h += '<div style="font-size:9px;color:#64748b;margin-bottom:7px">PROGRESSO DE SESS\u00d5ES</div>';
  h += mkBar(v,cor,10);
  h += '<div style="font-size:13px;color:#1e293b;margin-top:7px">'+p.real+'/'+p.presc+' sess\u00f5es ('+v+'%)</div></div>';
  if(p.obs) h += '<div style="background:#fffbeb;border:1px solid #d9770633;border-radius:9px;padding:10px;font-size:12px;color:#1e293b;margin-bottom:12px">'+esc(p.obs)+'</div>';
  h += '<div class="brow">';
  h += '<button class="btn by bfw" onclick="editPac(\''+id+'\')">\u270f\ufe0f Editar</button>';
  h += '<button class="btn br bfw" onclick="delPac(\''+id+'\')">\ud83d\uddd1 Excluir</button>';
  h += '</div>';
  openDrawer('\ud83d\udc41 Prontu\u00e1rio', h, cor);
}

function savePacForm() {
  var nome = (document.getElementById('f-nome')||{}).value||'';
  if(!nome.trim()){ toast('Nome obrigat\u00f3rio!',false); return; }
  var selProc = document.getElementById('f-cod-proc');
  var manProc = document.getElementById('f-cod-proc-man');
  var fromMan = manProc ? String(manProc.value||'').trim() : '';
  var fromSel = selProc && selProc.selectedIndex>0 ? String(selProc.value||'').trim() : '';
  var codProc = fromMan || fromSel || '';
  codProc = String(codProc||'').trim().replace(/\0/g,'');
  if(codProc.length>12000) codProc = codProc.slice(0,12000);
  var pac = {
    id:    (document.getElementById('f-id')||{}).value||('p'+uid()),
    nome:  nome.trim(),
    cid:   (document.getElementById('f-cid')||{}).value||'',
    cod_procedimento: codProc,
    orig:  (document.getElementById('f-orig')||{}).value||'RE',
    diag:  (document.getElementById('f-diag')||{}).value||'',
    prof:  (document.getElementById('f-prof')||{}).value||'',
    est:   (document.getElementById('f-est')||{}).value||'',
    hor:   (document.getElementById('f-hor')||{}).value||'07:30',
    tel:   (document.getElementById('f-tel')||{}).value||'',
    adm:   (document.getElementById('f-adm')||{}).value||'',
    alta:  (document.getElementById('f-alta')||{}).value||'',
    presc: parseInt((document.getElementById('f-presc')||{}).value)||20,
    real:  parseInt((document.getElementById('f-real')||{}).value)||0,
    obs:   (document.getElementById('f-obs')||{}).value||'',
    ativo: true
  };
  upsertPatientRecord(pac).then(function(){
    closeDrawer(); toast('Paciente salvo!'); renderAlerts(); go(ST.tab);
  }).catch(function(e){ toast('Erro: '+pacienteFriendlySupabaseErr(e.message),false); });
}

function delPac(id) {
  showCfm('Excluir este paciente definitivamente?', function(){
    sbDel('pacientes',id).then(function(){
      ST.patients = ST.patients.filter(function(p){return p.id!==id;});
      closeDrawer(); toast('Paciente removido.'); go(ST.tab);
    }).catch(function(e){ toast('Erro: '+e.message,false); });
  });
}

function toggleAtivo(id, val) {
  sbUpd('pacientes',id,{ativo:val}).then(function(){
    ST.patients = ST.patients.map(function(p){return p.id===id?Object.assign({},p,{ativo:val}):p;});
    renderAlerts(); go(ST.tab);
  }).catch(function(e){ toast('Erro: '+e.message,false); });
}

// \u2500\u2500 PACIENTES SCREEN \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
var pacsSearch='', pacsProfF='TODOS', pacsEstF='';
var pacsAdmMes='', pacsAdmDe='', pacsAdmAte='', pacsAltaDe='', pacsAltaAte='';
var pacsSoloVencidos=false, pacsCidF='', pacsProcF='', pacsOrigF='', pacsAtivoF='TODOS';
var pacsAlertaTratamento=false, pacsAlertaPrazo=false;
/** Painel refinado expandido (ou sempre visível se houver filtros avançados ativos). */
var pacsAdvPanelOpen=false;
function pacsContarFiltrosAvancados(){
  var n=0;
  if(pacsAdmMes)n++;
  if(pacsAdmDe)n++;
  if(pacsAdmAte)n++;
  if(pacsAltaDe)n++;
  if(pacsAltaAte)n++;
  if(pacsCidF)n++;
  if(pacsProcF)n++;
  if(pacsOrigF)n++;
  if(pacsAtivoF!=='TODOS')n++;
  if(pacsSoloVencidos)n++;
  if(pacsAlertaTratamento)n++;
  if(pacsAlertaPrazo)n++;
  return n;
}
function togglePacsAdvPanel(){
  if(pacsContarFiltrosAvancados()>0) return;
  pacsAdvPanelOpen=!pacsAdvPanelOpen;
  renderPacs();
}
function pacsMesesAdmissaoDistintos(){
  var o={};
  (ST.patients||[]).forEach(function(p){
    if(p.adm && /^\d{4}-\d{2}/.test(String(p.adm))) o[p.adm.slice(0,7)]=true;
  });
  return Object.keys(o).sort().reverse();
}
function pacsCidsDistintos(){
  return uniqStringsPt((ST.patients||[]).map(function(p){ return cleanTxt(p.cid||''); }).filter(Boolean));
}
function pacsProcedimentosDistintos(){
  return uniqStringsPt((ST.patients||[]).map(function(p){ return cleanTxt(String(p.cod_procedimento||'')); }).filter(Boolean));
}
function pacienteBuscaCampoContem(pt, qq){
  if(!qq)return true;
  if(normName(pt.nome).indexOf(qq)>=0) return true;
  if(normName(profNome(pt.prof)).indexOf(qq)>=0) return true;
  if(normName(pt.cid||'').indexOf(qq)>=0) return true;
  if(normName(String(pt.cod_procedimento||'')).indexOf(qq)>=0) return true;
  if(normName(pt.diag||'').indexOf(qq)>=0) return true;
  if(normName(pt.est||'').indexOf(qq)>=0) return true;
  return false;
}
function limparFiltrosPacsAvancados(){
  pacsAdmMes=''; pacsAdmDe=''; pacsAdmAte=''; pacsAltaDe=''; pacsAltaAte='';
  pacsSoloVencidos=false; pacsCidF=''; pacsProcF=''; pacsOrigF=''; pacsAtivoF='TODOS';
  pacsAlertaTratamento=false; pacsAlertaPrazo=false;
  pacsAdvPanelOpen=false;
  renderPacs();
}
function redefinirFiltrosPacsLista(){
  pacsSearch=''; pacsProfF='TODOS'; pacsEstF='';
  limparFiltrosPacsAvancados();
}
function renderPacs() {
  var qq = normName(pacsSearch);
  var filtered = ST.patients.filter(function(p){
    var prf=ST.profs.find(function(x){ return x.id===p.prof; });
    if(prf&&!profMetaMatch(prf)) return false;
    if(pacsProfF!=='TODOS'&&p.prof!==pacsProfF) return false;
    if(pacsEstF&&p.est!==pacsEstF) return false;
    if(qq && !pacienteBuscaCampoContem(p, qq)) return false;
    if(pacsAdmMes && (!p.adm || p.adm.slice(0,7)!==pacsAdmMes)) return false;
    if(pacsAdmDe && (!p.adm || p.adm<pacsAdmDe)) return false;
    if(pacsAdmAte && (!p.adm || p.adm>pacsAdmAte)) return false;
    if(pacsAltaDe && (!p.alta || !/^\d{4}-\d{2}-\d{2}$/.test(String(p.alta||'')) || p.alta<pacsAltaDe)) return false;
    if(pacsAltaAte && (!p.alta || !/^\d{4}-\d{2}-\d{2}$/.test(String(p.alta||'')) || p.alta>pacsAltaAte)) return false;
    if(pacsSoloVencidos){
      if(!p.alta || !/^\d{4}-\d{2}-\d{2}$/.test(String(p.alta))) return false;
      var ta=new Date(String(p.alta)+'T12:00:00').getTime();
      var hj=new Date(); hj.setHours(12,0,0,0);
      if(!(ta<hj.getTime())) return false;
    }
    if(pacsCidF && normName(cleanTxt(p.cid||''))!==normName(pacsCidF)) return false;
    if(pacsProcF && normName(cleanTxt(String(p.cod_procedimento||'')))!==normName(pacsProcF)) return false;
    if(pacsOrigF && String(p.orig||'').toUpperCase()!==pacsOrigF) return false;
    if(pacsAtivoF==='ATIVO' && !p.ativo) return false;
    if(pacsAtivoF==='INATIVO' && p.ativo) return false;
    if(pacsAlertaTratamento && !(p.ativo && p.presc>0 && pct(p.real,p.presc)>=80)) return false;
    if(pacsAlertaPrazo && !pacienteEmAlertaAltaTemporal(p)) return false;
    return true;
  });
  var estOpts = pacsProfF==='TODOS'
    ? [].concat.apply([],ST.profs.filter(profMetaMatch).map(function(p){return p.estagiarios||[];}))
    : (ST.profs.find(function(p){return p.id===pacsProfF;})||{}).estagiarios||[];
  estOpts = estOpts.filter(function(v,i,a){return a.indexOf(v)===i;});
  var mesesAdm = pacsMesesAdmissaoDistintos();
  var cidsL = pacsCidsDistintos();
  var procsL = pacsProcedimentosDistintos();
  var faCount=pacsContarFiltrosAvancados();
  var advOpen = faCount>0 || pacsAdvPanelOpen;

  var h='';
  h += '<div class="pacs-shell">';
  h += '<div class="pacs-hero-mini"><h1>Cadastro cl\u00ednico</h1><p>Busca inteligente por nome, CID e equipe. Combine supervisor e estagi\u00e1rio no painel r\u00e1pido; abra <b>Filtros refinados</b> s\u00f3 quando precisar de datas, procedimento ou alertas.</p></div>';
  h += '<div class="pacs-parceira-slot">'+htmlBarraFiltrosParceiraCurso({compact:true})+'</div>';
  h += '<div class="pacs-toolbar-card"><div class="pacs-toolbar">';
  h += '<div class="pacs-toolbar-row pacs-toolbar-row--search">';
  h += '<input class="search-field" value="'+esc(pacsSearch)+'" oninput="pacsSearch=this.value;renderPacs()" placeholder="Buscar nome, equipe, CID, procedimento ou diagn\u00f3stico\u2026"/>';
  h += '<button type="button" class="btn bp" style="padding:12px 18px;white-space:nowrap;flex-shrink:0" onclick="newPac()">+ Novo paciente</button>';
  h += '</div>';
  h += '<div class="pacs-toolbar-row pacs-toolbar-row--filters">';
  h += '<div class="pacs-profs-strip">';
  var pfOpts=[{id:'TODOS',label:'Todos',cor:'#94a3b8'}].concat(ST.profs.filter(profMetaMatch).map(function(p){return{id:p.id,label:p.nome.split(' ')[0],cor:p.cor};}));
  pfOpts.forEach(function(x){
    var sel=pacsProfF===x.id;
    var corx=x.id==='TODOS'? '#64748b' : (x.cor||'#0d9488');
    var bc=sel?corx:'#cbd5e1';
    var bg=sel?(corx+'22'):'linear-gradient(180deg,#fafbfc,#ffffff)';
    var tc=sel?corx:'#64748b';
    h += '<button type="button" class="dash-chip'+(sel?' is-on':'')+'" onclick="pacsProfF=\''+x.id+'\';pacsEstF=\'\';renderPacs()" style="border-color:'+bc+';background:'+bg+';color:'+tc+'">'+esc(x.label)+'</button>';
  });
  h += '</div>';
  h += '<select class="pacs-select-est" onchange="pacsEstF=this.value;renderPacs()" aria-label="Filtrar por estagi\u00e1rio">';
  h += '<option value="">Todos os estagi\u00e1rios</option>';
  estOpts.forEach(function(e){ h += '<option value="'+esc(e)+'"'+(pacsEstF===e?' selected':'')+'>'+esc(e)+'</option>'; });
  h += '</select>';
  h += '</div>';

  h += '<div class="pacs-adv-wrap">';
  h += '<div class="pacs-adv-head">';
  h += '<button type="button" class="pacs-adv-toggle" onclick="togglePacsAdvPanel()" '+(faCount?'disabled ':'')+'title="'+(faCount?'Limpe os filtros refinados antes de ocultar este painel.':'Abrir ou fechar datas, CID, alertas.')+'">';
  if(faCount) h += '<span class="pacs-adv-badge" aria-hidden="true">'+faCount+'</span>';
  h += '<span>'+(advOpen?'\u25bc ':'\u25b6 ')+'Filtros refinados</span>';
  if(faCount) h += '<span class="pacs-adv-muted" style="opacity:.85">('+faCount+' ativo'+String(faCount===1?'':'s')+')</span>';
  h += '</button>';
  if(!advOpen && faCount) h += '<span class="pacs-adv-muted">H\u00e1 crit\u00e9rios ativos nos filtros refinados.</span>';
  h += '</div>';
  if(advOpen){
    h += '<div class="pacs-adv-panel">';
    h += '<div class="pacs-filters-grid">';
    h += '<div class="field"><label>M\u00eas de admiss\u00e3o</label><select onchange="pacsAdmMes=this.value;renderPacs()">';
    h += '<option value="">'+(mesesAdm.length?'Qualquer':'Sem datas em cadastro')+'</option>';
    mesesAdm.forEach(function(m){
      var y=m.slice(0,4), mo=parseInt(m.slice(5,7),10);
      var tit=(MESES_PT[mo-1]||m.slice(5))+' / '+y;
      h += '<option value="'+esc(m)+'"'+(pacsAdmMes===m?' selected':'')+'>'+esc(tit)+'</option>';
    });
    h += '</select></div>';
    h += '<div class="field"><label>Admiss\u00e3o de</label><input type="date" value="'+esc(pacsAdmDe)+'" onchange="pacsAdmDe=this.value;renderPacs()"/></div>';
    h += '<div class="field"><label>Admiss\u00e3o at\u00e9</label><input type="date" value="'+esc(pacsAdmAte)+'" onchange="pacsAdmAte=this.value;renderPacs()"/></div>';
    h += '<div class="field"><label>Alta / venc. de</label><input type="date" value="'+esc(pacsAltaDe)+'" onchange="pacsAltaDe=this.value;renderPacs()"/></div>';
    h += '<div class="field"><label>Alta / venc. at\u00e9</label><input type="date" value="'+esc(pacsAltaAte)+'" onchange="pacsAltaAte=this.value;renderPacs()"/></div>';
    h += '<div class="field"><label>CID</label><select onchange="pacsCidF=this.value;renderPacs()">';
    h += '<option value="">Todos</option>';
    cidsL.forEach(function(c){ h += '<option value="'+esc(c)+'"'+(normName(pacsCidF)===normName(c)?' selected':'')+'>'+esc(c)+'</option>'; });
    h += '</select></div>';
    h += '<div class="field"><label>Procedimento</label><select onchange="pacsProcF=this.value;renderPacs()">';
    h += '<option value="">Todos</option>';
    procsL.forEach(function(pr){ h += '<option value="'+esc(pr)+'"'+(normName(pacsProcF)===normName(pr)?' selected':'')+'>'+esc(pr)+'</option>'; });
    h += '</select></div>';
    h += '<div class="field"><label>Origem</label><select onchange="pacsOrigF=this.value;renderPacs()">';
    h += '<option value="">Todas</option>';
    ORIGENS.forEach(function(o){ h += '<option value="'+esc(o)+'"'+(pacsOrigF===o?' selected':'')+'>'+esc(origemExibir(o))+' ('+esc(o)+')</option>'; });
    h += '</select></div>';
    h += '<div class="field"><label>Lista</label><select onchange="pacsAtivoF=this.value;renderPacs()">';
    h += '<option value="TODOS"'+(pacsAtivoF==='TODOS'?' selected':'')+'>Ativos e inativos</option>';
    h += '<option value="ATIVO"'+(pacsAtivoF==='ATIVO'?' selected':'')+'>S\u00f3 ativos</option>';
    h += '<option value="INATIVO"'+(pacsAtivoF==='INATIVO'?' selected':'')+'>S\u00f3 inativos</option>';
    h += '</select></div>';
    h += '</div>';
    h += '<div class="pacs-filters-chk">';
    h += '<label><input type="checkbox" '+(pacsSoloVencidos?'checked':'')+' onchange="pacsSoloVencidos=this.checked;renderPacs()"/> Alta vencida</label>';
    h += '<label><input type="checkbox" '+(pacsAlertaTratamento?'checked':'')+' onchange="pacsAlertaTratamento=this.checked;renderPacs()"/> Alerta \u226580% sess\u00f5es</label>';
    h += '<label><input type="checkbox" '+(pacsAlertaPrazo?'checked':'')+' onchange="pacsAlertaPrazo=this.checked;renderPacs()"/> Alerta RE/VE</label>';
    h += '</div>';
    h += '<div class="pacs-filters-actions">';
    h += '<button type="button" class="btn bd bsm" onclick="limparFiltrosPacsAvancados()">Limpar refinados</button>';
    h += '<button type="button" class="btn bg bsm" onclick="redefinirFiltrosPacsLista()">Redefinir tudo</button>';
    h += '</div></div>';
  }
  h += '</div>';

  h += '<div class="pacs-count-bar">';
  h += '<p class="pacs-count-lbl">Pacientes encontrados<strong class="mono">'+filtered.length+'</strong></p>';
  h += '<button type="button" class="btn bd bsm" onclick="redefinirFiltrosPacsLista()">Limpar busca</button>';
  h += '</div>';

  h += '</div></div>';

  h += '<div class="pacs-grid">';
  if(!filtered.length){
    h += '<div class="pacs-empty" role="status">Nenhum paciente com os crit\u00e9rios atuais. Ajuste a busca, o supervisor ou abra filtros refinados.</div>';
  }
  filtered.forEach(function(p){
    var v   = pct(p.real,p.presc);
    var pr  = ST.profs.find(function(x){return x.id===p.prof;});
    var cor = pr ? pr.cor : '#94a3b8';
    var ss  = ST.sessoes.filter(function(s){return s.pid===p.id;});
    var spP = ss.filter(function(s){return s.status==='P';}).length;
    var spF = ss.filter(function(s){return s.status==='F';}).length;
    var vc  = v>=100?'#059669':v>=70?cor:v>=40?'#d97706':'#dc2626';
    h += '<div class="card pacs-card'+(p.ativo?'':' pacs-card--inactive')+'">';
    h += '<div class="pacs-card-accent" style="background:'+esc(cor)+'"></div>';
    h += '<div class="pacs-card-body">';
    h += '<div class="pacs-card-top">';
    h += '<div style="flex:1;min-width:0">';
    h += '<div class="pacs-card-name">'+esc(p.nome)+'</div>';
    h += '<div class="pacs-meta-row">'+mkTag(origemExibir(p.orig),ORIG_COR[p.orig]||'#94a3b8')+(p.cid?mkTag(p.cid,cor):'')+'<span class="pacs-meta-est">\ud83d\udc64 '+esc(p.est||'\u2014')+'</span></div>';
    h += '</div>';
    h += '<div class="pacs-card-side">';
    h += '<div class="pacs-card-clock">\u23f0 '+esc(p.hor||'')+'</div>';
    h += '<div class="pacs-card-pct" style="color:'+vc+'">'+v+'%</div>';
    h += '</div></div>';
    h += mkBar(v,cor,5);
    h += '<div class="pacs-card-footer">';
    h += '<div class="pacs-card-metrics"><span>'+p.real+' / '+p.presc+' sess\u00f5es</span><span>'+spP+' P \u00b7 '+spF+' F</span></div>';
    h += '<div><div class="pacs-card-super" style="color:'+esc(cor)+'">'+(pr?esc(pr.nome.split(' ')[0]):esc(p.prof))+'</div>';
    var prMeta=pr?profBadgeMetaLine(pr):'';
    if(prMeta) h += '<div class="pacs-card-super-sub">'+prMeta+'</div>';
    h += '</div></div>';
    h += '<div class="pacs-card-actions">';
    h += '<button type="button" class="pacs-act pacs-act--ghost" onclick="viewPac(\''+p.id+'\')">Ver</button>';
    h += '<button type="button" class="pacs-act pacs-act--muted" onclick="editPac(\''+p.id+'\')">Editar</button>';
    var tglCls=p.ativo?'pacs-act pacs-act--inactive':'pacs-act pacs-act--ok';
    h += '<button type="button" class="'+tglCls+'" onclick="toggleAtivo(\''+p.id+'\','+(!p.ativo)+')">'+(p.ativo?'Desativar':'Ativar')+'</button>';
    h += '<button type="button" class="pacs-act pacs-act--danger" title="Excluir" onclick="delPac(\''+p.id+'\')">\ud83d\uddd1</button>';
    h += '</div></div></div>';
  });
  h += '</div>';

  setHtml('s-pacs', h);

function calcDatas(prof, ano, mes) {
  var diasN=(prof.dias||[]).map(function(d){return DIAS_NUM[d]||0;});
  var total=new Date(ano,mes,0).getDate();
  var res=[];
  for(var d=1;d<=total;d++){
    var dow=new Date(ano,mes-1,d).getDay();
    if(diasN.indexOf(dow)>=0){
      res.push(ano+'-'+String(mes).padStart(2,'0')+'-'+String(d).padStart(2,'0'));
    }
  }
  return res;
}

// \u2500\u2500 RELAT\u00d3RIO \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
var relMes=today().slice(0,7), relProf='TODOS', relEst='TODOS';
/** Meses do relat\u00f3rio: intervalo cont\u00ednuo como no dashboard (+ admiss\u00f5es + m\u00eas atual). */
function relListaMesesSelect(){
  function cmpYm(a,b){
    var sa=String(a), sb=String(b);
    if(sa<sb) return -1;
    if(sa>sb) return 1;
    return 0;
  }
  function addMonthYm(ym){
    var y=parseInt(ym.slice(0,4),10), m=parseInt(ym.slice(5,7),10)||1;
    m+=1;
    if(m>12){ m=1; y++; }
    return y+'-'+String(m).padStart(2,'0');
  }
  var set={};
  (ST.sessoes||[]).forEach(function(s){
    var d=s&&s.data;
    if(!d||String(d).length<7) return;
    set[String(d).slice(0,7)]=true;
  });
  (ST.patients||[]).forEach(function(p){
    if(p.adm && /^\d{4}-\d{2}/.test(String(p.adm))) set[p.adm.slice(0,7)]=true;
  });
  var hoje=today().slice(0,7);
  set[hoje]=true;
  set[relMes]=true;
  var keys=Object.keys(set).filter(Boolean);
  keys.sort(cmpYm);
  if(keys.length===0) return [hoje];
  var minYm=keys[0], maxYm=keys[keys.length-1];
  [hoje,relMes].forEach(function(m){
    if(!m) return;
    if(cmpYm(m,minYm)<0) minYm=m;
    if(cmpYm(m,maxYm)>0) maxYm=m;
  });
  var out=[], cur=minYm;
  for(var guard=0;guard<240;guard++){
    out.push(cur);
    if(cur===maxYm) break;
    cur=addMonthYm(cur);
  }
  out.sort(function(a,b){ return cmpYm(b,a); });
  return out;
}
function relSnapshotFromState(){
  var meses = relListaMesesSelect();
  if(!meses.length) meses=[today().slice(0,7)];
  var relMesUse = meses.indexOf(relMes)>=0 ? relMes : meses[0];

  var patMap={};
  (ST.patients||[]).forEach(function(p){ patMap[p.id]=p; });

  var sm = (ST.sessoes||[]).filter(function(s){
    if(!s||!s.data||String(s.data).slice(0,7)!==relMesUse) return false;
    if(!sessaoProfConferePaciente(s,patMap)) return false;
    var pacS=pacientePorIdMap(patMap,s.pid);
    if(!pacS) return false;
    var prf=s.prof&&ST.profs.find(function(pp){ return pp.id===s.prof;});
    if(prf&&!profMetaMatch(prf)) return false;
    if(relProf!=='TODOS'&&pacS.prof!==relProf) return false;
    if(relEst!=='TODOS'&&String(pacS.est||'')!==String(relEst)) return false;
    return true;
  });

  var byPac={};
  sm.forEach(function(s){
    var canon=(pacientePorIdMap(patMap,s.pid)||{}).id;
    var pk=canon!=null&&canon!==''?canon:s.pid;
    if(!byPac[pk]) byPac[pk]={P:0,F:0,FJ:0,AV:0,D:0,TM:0};
    byPac[pk][s.status]=(byPac[pk][s.status]||0)+1;
  });

  var P=0,F=0,FJ=0;
  sm.forEach(function(s){
    if(s.status==='P') P++;
    else if(s.status==='F') F++;
    else if(s.status==='FJ') FJ++;
  });

  var tc = sm.length ? Math.round(P/sm.length*100) : 0;

  var estSet={};
  (ST.patients||[]).forEach(function(q){
    var prx=ST.profs.find(function(pp){return pp.id===q.prof;});
    if(prx&&!profMetaMatch(prx)) return;
    if(relProf!=='TODOS'&&q.prof!==relProf) return;
    var te=cleanTxt(String(q.est||''));
    if(te) estSet[te]=true;
  });
  var estOpts=Object.keys(estSet).sort(function(a,b){return normName(a).localeCompare(normName(b),'pt');});

  var rank=[];
  if(ymExibeProfEstPaciente(relMesUse)){
    var rankEst={};
    sm.forEach(function(s){
      var pacR=pacientePorIdMap(patMap,s.pid); if(!pacR) return;
      var nk=cleanTxt(String(pacR.est||s.est||'')).trim()||'\u2014';
      if(!rankEst[nk]) rankEst[nk]={P:0,F:0,total:0};
      rankEst[nk].total++;
      if(s.status==='P') rankEst[nk].P++;
      if(s.status==='F') rankEst[nk].F++;
    });
    rank=Object.keys(rankEst).map(function(n){
      var d=rankEst[n];
      return { nome:n,P:d.P,F:d.F,total:d.total,taxa:d.total?Math.round(d.P/d.total*100):0 };
    }).sort(function(a,b){ return b.taxa-a.taxa; });
  }

  var filtParcLbl = !filtroParceira ? 'Todas' : cleanTxt(filtroParceira);
  var filtCursoLbl = !filtroCursoPreceptoria ? 'Todos' : cleanTxt(filtroCursoPreceptoria);
  var profLbl = relProf==='TODOS' ? 'Todos os professores'
    : cleanTxt((ST.profs.find(function(p){ return p.id===relProf; })||{}).nome||relProf);
  var estLbl = relEst==='TODOS' ? 'Todos estagi\u00e1rios' : cleanTxt(relEst);

  return {
    meses:meses,
    relMes:relMesUse,
    mesTitulo:dashMesTitulo(relMesUse),
    filtParcLbl:filtParcLbl,
    filtCursoLbl:filtCursoLbl,
    profLbl:profLbl,
    estLbl:estLbl,
    sm:sm,
    patMap:patMap,
    byPac:byPac,
    P:P,F:F,FJ:FJ,
    tc:tc,
    rank:rank,
    estOpts:estOpts
  };
}
/** Contagens P/F/FJ etc. no m\u00eas para o paciente (chave pode divergir string/number em byPac). */
function relStatMesForPac(byPac, pac){
  var st=pacientePorIdMap(byPac,pac&&pac.id);
  if(st) return st;
  return {P:0,F:0,FJ:0,AV:0,D:0,TM:0};
}
/** Supervisores que entram nos filtros atuais do relat\u00f3rio (prof + meta parceira/curso). */
function relProfIdsNoFiltroRel(){
  var o={};
  (ST.profs||[]).forEach(function(p){
    if((relProf==='TODOS'||p.id===relProf)&&profMetaMatch(p)) o[p.id]=true;
  });
  return o;
}
/** Quantidade de pacientes na carteira (cadastro) coerente com professor e estagi\u00e1rio selecionados. */
function relContaPacientesCarteiraFiltro(){
  var ok=relProfIdsNoFiltroRel();
  var n=0;
  (ST.patients||[]).forEach(function(p){
    if(!(ok[p.prof]||ok[String(p.prof)])) return;
    if(relEst!=='TODOS'&&String(p.est||'')!==String(relEst)) return;
    n++;
  });
  return n;
}
/** IDs de pacientes sob responsabilidade do supervisor, ordenados por nome (respeita filtro de estagi\u00e1rio). */
function relPacIdsCarteiraDoProf(profId, patMap){
  var ids=[];
  (ST.patients||[]).forEach(function(p){
    if(String(p.prof||'')!==String(profId)) return;
    if(relEst!=='TODOS'&&String(p.est||'')!==String(relEst)) return;
    ids.push(p.id);
  });
  ids.sort(function(a,b){
    var pa=pacientePorIdMap(patMap,a), pb=pacientePorIdMap(patMap,b);
    if(!pa||!pb) return 0;
    return normName(cleanTxt(String(pa.nome||''))).localeCompare(normName(cleanTxt(String(pb.nome||''))),'pt');
  });
  return ids;
}
function relForEachDetailRow(snap, fn){
  var profOk=relProfIdsNoFiltroRel();
  var idList=[];
  var seen={};
  function hasSeen(id){ return id!=null&&id!==''&&(!!seen[id]||!!seen[String(id)]); }
  function mark(id){ if(id==null||id==='') return; seen[id]=true; seen[String(id)]=true; }

  (ST.patients||[]).forEach(function(p){
    if(!(profOk[p.prof]||profOk[String(p.prof)])) return;
    if(relEst!=='TODOS'&&String(p.est||'')!==String(relEst)) return;
    idList.push(p.id);
    mark(p.id);
  });
  if(relProf==='TODOS'){
    Object.keys(snap.byPac).forEach(function(bk){
      if(hasSeen(bk)) return;
      var pac=pacientePorIdMap(snap.patMap,bk);
      if(!pac||String(pac.prof||'').trim()) return;
      if(relEst!=='TODOS'&&String(pac.est||'')!==String(relEst)) return;
      var pid=pac.id!=null?pac.id:bk;
      if(hasSeen(pid)) return;
      idList.push(pid);
      mark(pid);
    });
  }
  idList.sort(function(a,b){
    var pa=pacientePorIdMap(snap.patMap,a), pb=pacientePorIdMap(snap.patMap,b);
    if(!pa||!pb) return !pa&&!pb?0:!pa?1:-1;
    var cmp=normName(cleanTxt(String(pa.nome||''))).localeCompare(normName(cleanTxt(String(pb.nome||''))),'pt');
    if(cmp!==0) return cmp;
    return String(a).localeCompare(String(b));
  });
  idList.forEach(function(pid){
    var pac=pacientePorIdMap(snap.patMap,pid);
    if(!pac) return;
    var pr=ST.profs.find(function(z){ return z.id===pac.prof; });
    if(pr&&!profMetaMatch(pr)) return;
    var stat=relStatMesForPac(snap.byPac,pac);
    var v=pct(pac.real,pac.presc);
    var totSess=(stat.P||0)+(stat.F||0)+(stat.FJ||0)+(stat.AV||0)+(stat.D||0)+(stat.TM||0);
    var sit;
    if(v>=100) sit='\u00c9 alta por t\u00e9rmino';
    else if(v>=80) sit='Pr\u00f3ximo de alta';
    else sit=pac.ativo?'Em tratamento':'Inativo';
    fn({ pid:pid,pac:pac,stat:stat,v:v,totSess:totSess,sit:sit });
  });
}

  if(op.incluir_insc_mun!==false && cleanTxt(e.inscr_municipal)) empRows.push(['Inscri\u00e7\u00e3o municipal (IM)', cleanTxt(e.inscr_municipal)]);
  if(op.incluir_endereco!==false && cleanTxt(e.endereco)) empRows.push(['Endere\u00e7o', cleanTxt(e.endereco)]);

  if(empRows.length){
    resumo.push(['--- Dados da empresa contratante ---']);
    empRows.forEach(function(r){ resumo.push(r); });
    resumo.push([]);
  }

  if(op.bloco_resumo_kpis!==false){
    resumo.push(['--- Resumo do m\u00eas ---']);

    resumo.push(['Pacientes com pelo menos uma sess\u00e3o no m\u00eas', Object.keys(snap.byPac).length]);
    resumo.push(['Sess\u00f5es (filtradas)', snap.sm.length]);
    resumo.push(['Presen\u00e7as', snap.P]);
    resumo.push(['Faltas', snap.F]);
    resumo.push(['Faltas justificadas', snap.FJ]);
    resumo.push(['Taxa de presen\u00e7a / sess\u00f5es', snap.tc+'%']);
    resumo.push([]);
  }

  if(op.excel_tabela_embutida_resumo!==false){
    resumo.push(['Tabela por paciente: nome, CID, procedimento, presen\u00e7as/faltas no m\u00eas, etc.']);
    if(op.excel_aba_detalhe!==false) resumo.push(['(C\u00f3pia tamb\u00e9m na aba Detalhe)']);
    resumo.push([]);

    if(det.length) det.forEach(function(row){ resumo.push(row); });
    else resumo.push(['Nenhum paciente neste filtro'].concat(Array(hdrDet.length-1).fill('')));
  }

  var wsResumo = XLSX.utils.aoa_to_sheet(resumo);
  if(op.excel_tabela_embutida_resumo!==false){
    wsResumo['!cols'] = hdrDet.map(function(_, ix){
      var w=[24,22,14,26,26,14,12,14,14,11,11,11,10,13,11,11,11,24];
      return { wch:w[ix]!=null?w[ix]:14 };
    });
  } else {
    wsResumo['!cols'] = [{wch:32},{wch:56}];
  }

  XLSX.utils.book_append_sheet(wb, wsResumo, 'Resumo');

  if(op.excel_aba_ranking!==false){
    var hdrRank=[['Posi\u00e7\u00e3o','Estagi\u00e1rio','Presen\u00e7as','Faltas','Sess\u00f5es total','Taxa %']];
    var bodyRank=snap.rank.map(function(r,i){ return [i+1,r.nome,r.P,r.F,r.total,r.taxa]; });
    if(!bodyRank.length){
      bodyRank=[
        ['\u2014',ymExibeProfEstPaciente(snap.relMes)?'Sem dados neste filtro':'Compet\u00eancias antes de mar/2026 sem coluna de estagi\u00e1rio no ranking','','','','']
      ];
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(hdrRank.concat(bodyRank)), 'Ranking');
  }

  if(op.excel_aba_detalhe!==false){
    var wsDet = XLSX.utils.aoa_to_sheet([hdrDet].concat(det.length?det:[['Nenhum dado neste filtro'].concat(Array(hdrDet.length-1).fill(''))]));
    if(wsResumo['!cols'] && wsResumo['!cols'].length>=hdrDet.length) wsDet['!cols'] = wsResumo['!cols'];
    XLSX.utils.book_append_sheet(wb, wsDet, 'Detalhe');
  }

  XLSX.writeFile(wb, 'relatorio-produtividade-'+snap.relMes+'-'+fileStamp()+'.xlsx');
  toast('Excel exportado conforme as op\u00e7\u00f5es marcadas no relat\u00f3rio.', true);
}

      h+='<div style="text-align:right;margin-left:10px">';
      h+='<div style="font-size:22px;font-weight:800;color:'+(v>=100?'#059669':v>=80?'#d97706':prof.cor)+';line-height:1">'+v+'%</div>';
      h+='<div style="display:flex;gap:6px;margin-top:4px;justify-content:flex-end;font-size:12px;font-weight:700">';
      h+='<span style="color:#059669">'+contaPalavra(stat.P||0,'presen\u00e7a','presen\u00e7as')+'</span>';
      h+='<span style="color:#dc2626">'+contaPalavra(stat.F||0,'falta','faltas')+'</span>';
      h+='<span style="color:#d97706">'+contaPalavra(stat.FJ||0,'falta justificada','faltas justificadas')+'</span>';
      h+='</div></div></div>';
      h+='<div style="display:flex;gap:10px;align-items:center">';
      h+='<div style="flex:1;min-width:0">'+mkBar(v,prof.cor,5)+'</div>';
      h+='<span style="font-size:10px;color:var(--muted);font-weight:700;flex-shrink:0">'+tot+'/'+pac.presc+'</span></div></div>';
    });
    h+='</div>';
  });

  if(relProf==='TODOS'){
    var corOr='#94a3b8';
    var pacsOr=Object.keys(byPac).filter(function(id){
      var pac=pacientePorIdMap(patMap,id);
      if(!pac) return false;
      if(String(pac.prof||'').trim()) return false;
      return relEst==='TODOS'||String(pac.est||'')===String(relEst);
    });
    pacsOr.sort(function(pa,pb){
      var a=pacientePorIdMap(patMap,pa), b=pacientePorIdMap(patMap,pb);
      if(!a||!b) return !a&&!b?0:!a?1:-1;
      var cmp=normName(cleanTxt(String(a.nome||''))).localeCompare(normName(cleanTxt(String(b.nome||''))),'pt');
      if(cmp!==0) return cmp;
      return String(pa).localeCompare(String(pb));
    });
    if(pacsOr.length){
      relListouAlgumPaciente=true;
      h+='<div class="rel-prof-card card" style="border-color:'+corOr+'44">';
      h+='<div class="rel-prof-ch" style="background:'+corOr+'18;color:#64748b">';
      h+='<div style="flex:1;min-width:0"><span style="font-weight:800;font-size:15px">Sem supervisor cadastrado</span>';
      h+='<div style="font-size:11px;font-weight:600;opacity:.92;margin-top:4px;line-height:1.35">Pacientes com sess\u00e3o no m\u00eas, sem campo de professor preenchido.</div>';
      h+='</div><span style="font-size:12px;font-weight:700;opacity:.9">'+pacsOr.length+' pacientes</span></div>';
      pacsOr.forEach(function(pid2,i2){
        var pac=pacientePorIdMap(patMap,pid2); if(!pac) return;
        var stat=relStatMesForPac(byPac,pac);
        var ymViRel=ymExibeProfEstPaciente(snap.relMes);
        var v=pct(pac.real,pac.presc);
        var tot=(stat.P||0)+(stat.F||0)+(stat.FJ||0)+(stat.AV||0);
        var sit=v>=100?'\ud83c\udfc1 Alta por t\u00e9rmino':v>=80?'\u26a0\ufe0f Pr\u00f3x. alta':pac.ativo?'\u25b6 Em tratamento':'\u26d4 Inativo';
        h+='<div class="rel-pac-row">';
        h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">';
        h+='<div style="flex:1;min-width:0">';
        h+='<div style="font-size:13px;font-weight:800;color:var(--text-card)">'+esc(cleanTxt(String(pac.nome||''))||'(sem nome)')+'</div>';
        h+='<div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:2px">CID '+(pac.cid?esc(pac.cid):'\u2014')+' \u00b7 Proc. '+(cleanTxt(String(pac.cod_procedimento!=null?pac.cod_procedimento:''))||'\u2014')+'</div>';
        h+='<div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:2px">';
        h+='<span title="Cart\u00e3o Nacional de Sa\u00fade do supervisor"><span style="border-bottom:1px dotted currentColor">CNS supervisor</span></span> \u2014 \u00b7 '+(ymViRel&&pac.est?esc(pac.est):'\u2014')+' \u00b7 '+mkTag(origemExibir(pac.orig),ORIG_COR[pac.orig]||'#94a3b8',8);
        h+='</div>';
        h+='<div style="font-size:11px;color:var(--muted);margin-top:2px">'+sit+'</div></div>';
        h+='<div style="text-align:right;margin-left:10px">';
        h+='<div style="font-size:22px;font-weight:800;color:'+(v>=100?'#059669':v>=80?'#d97706':corOr)+';line-height:1">'+v+'%</div>';
        h+='<div style="display:flex;gap:6px;margin-top:4px;justify-content:flex-end;font-size:12px;font-weight:700">';
        h+='<span style="color:#059669">'+contaPalavra(stat.P||0,'presen\u00e7a','presen\u00e7as')+'</span>';
        h+='<span style="color:#dc2626">'+contaPalavra(stat.F||0,'falta','faltas')+'</span>';
        h+='<span style="color:#d97706">'+contaPalavra(stat.FJ||0,'falta justificada','faltas justificadas')+'</span>';
        h+='</div></div></div>';
        h+='<div style="display:flex;gap:10px;align-items:center">';
        h+='<div style="flex:1;min-width:0">'+mkBar(v,corOr,5)+'</div>';
        h+='<span style="font-size:10px;color:var(--muted);font-weight:700;flex-shrink:0">'+tot+'/'+pac.presc+'</span></div></div>';
      });
      h+='</div>';
    }
  }

  if(!relListouAlgumPaciente) h+='<div class="rel-empty-soft">Nenhum paciente na carteira destes supervisores para os filtros atuais (professor / estagi\u00e1rio / parceira / curso).</div>';
  }

  if(ro.bloco_lista_supervisores===false && ro.bloco_resumo_kpis===false && ro.bloco_ranking===false) h+='<div class="rel-empty-soft" style="margin-top:14px">Ative pelo menos um bloco (Resumo, Ranking ou lista por supervisor) para ver o relat\u00f3rio.</div>';

  h+='</div>';
  setHtml('s-rel', h);
}

var _fProf = null;
function exportBackup() {
  downloadText('fisio-backup-'+fileStamp()+'.json', JSON.stringify({
    gerado_em:new Date().toISOString(),
    professores:ST.profs,
    pacientes:ST.patients,
    sessoes:ST.sessoes,
    politica_alta:politicaAlta(),
    empresa_contratante:empresaContratante(),
    catalogo_preceptoria:preceptorCatalog()
  }, null, 2), 'application/json;charset=utf-8');
  toast('Backup exportado.');
}
function exportRelCsv() {
  var rows = [['Paciente','Professor','CNS Professor','Instituicao parceira','Curso preceptoria','Estagiario','Origem','CID','Cod procedimento','Prescritas','Realizadas','Progresso','Ativo','Alta prevista']];
  ST.patients.forEach(function(p){
    rows.push([p.nome,profNome(p.prof),profCns(p.prof),profInstParceira(p.prof),profCursoPreceptoriaLabel(p.prof),p.est,p.orig,p.cid,String(p.cod_procedimento||''),p.presc,p.real,pct(p.real,p.presc)+'%',p.ativo?'Sim':'Nao',p.alta]);
  });
  var csv = rows.map(function(r){return r.map(csvCell).join(';');}).join('\n');
  downloadText('fisio-pacientes-'+fileStamp()+'.csv', csv, 'text/csv;charset=utf-8');
  toast('CSV exportado.');
}

    h+='<div style="display:flex;gap:7px">';

function openFormProf(id) {
  var p = id ? ST.profs.find(function(x){return x.id===id;}) : null;
  _fProf = p ? {id:p.id,nome:p.nome,cns:p.cns||'',cor:p.cor,dias:(p.dias||[]).slice(),estagiarios:(p.estagiarios||[]).slice(),
    instituicao_parceira:String(p.instituicao_parceira||''),curso_preceptoria:String(p.curso_preceptoria||'')} :
               {id:'prof'+uid(),nome:'',cns:'',cor:'#0d9488',dias:[],estagiarios:[],instituicao_parceira:'',curso_preceptoria:''};
  renderFormProf();
}

function renderFormProf() {
  var p = _fProf;
  var h = '';
  h += mkField('NOME COMPLETO', mkInput('fp-nome',p.nome,'text','Nome do professor'));
  h += mkField('CNS', mkInput('fp-cns',p.cns,'text','000 0000 0000 0000'));
  var catFrm = preceptorCatalog();
  var selInstOpts = catalogSelectOptsWithOrphan(uniqStringsPt(catFrm.instituicoes||[]), p.instituicao_parceira);
  var selCurOpts = catalogSelectOptsWithOrphan(uniqStringsPt(catFrm.cursos||[]), p.curso_preceptoria);
  h += mkField('UNIVERSIDADE OU EMPRESA \u0028lista cadastrada em Ajustes\u0029', mkSelect('fp-inst', selInstOpts, cleanTxt(p.instituicao_parceira||'')));
  h += mkField('CURSO DE EST\u00c1GIO \u0028PRECEPTORIA, opcional\u0029', mkSelect('fp-cur', selCurOpts, cleanTxt(p.curso_preceptoria||'')));
  h += '<div style="font-size:11px;color:#94a3b8;margin:-2px 0 12px;line-height:1.45">Cadastre nomes novos antes em <b>Ajustes\u2192Parceiras e cursos de est\u00e1gio</b>; aqui apenas seleciona.</div>';
  h += '<div><label style="font-size:10px;color:#64748b;font-weight:700;letter-spacing:1px;display:block;margin-bottom:8px">COR IDENTIFICADORA</label>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
  CORES_PROF.forEach(function(c){
    h += '<button onclick="_fProf.cor=\''+c+'\';renderFormProf()" style="width:36px;height:36px;border-radius:8px;background:'+c+';border:3px solid '+(p.cor===c?'white':'transparent')+';cursor:pointer"></button>';
  });
  h += '</div></div>';
  h += '<div><label style="font-size:10px;color:#64748b;font-weight:700;letter-spacing:1px;display:block;margin-bottom:8px">DIAS DE ATENDIMENTO</label>';
  h += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
  DIAS_SEQ.forEach(function(d){
    var sel=p.dias.indexOf(d)>=0;
    h += '<button onclick="toggleDiaProf(\''+d+'\')" style="padding:8px 14px;border-radius:20px;border:2px solid '+(sel?p.cor:'#e2e8f0')+';background:'+(sel?p.cor+'22':'transparent')+';color:'+(sel?p.cor:'#64748b')+';cursor:pointer;font-weight:700;font-size:12px;font-family:inherit">'+DIAS_LBL[d]+'</button>';
  });
  h += '</div></div>';
  h += '<div><label style="font-size:10px;color:#64748b;font-weight:700;letter-spacing:1px;display:block;margin-bottom:8px">ESTAGI\u00c1RIOS</label>';
  h += '<div style="display:flex;gap:8px;margin-bottom:8px">';
  h += '<input id="fp-est" placeholder="Nome do estagi\u00e1rio" onkeydown="if(event.key===\'Enter\')addEstProf()" style="flex:1;background:#ffffff;border:1px solid #e2e8f0;border-radius:9px;padding:10px 12px;color:#1e293b;font-size:13px;font-family:inherit;outline:none"/>';
  h += '<button class="btn bp bsm" onclick="addEstProf()">+</button></div>';
  h += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
  p.estagiarios.forEach(function(e){
    h += '<span style="background:'+p.cor+'22;color:'+p.cor+';border:1px solid '+p.cor+'44;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:6px">';
    h += esc(e)+'<button onclick="delEstProf(\''+esc(e)+'\')" style="background:none;border:none;color:'+p.cor+';cursor:pointer;font-size:14px;line-height:1;padding:0">\u00d7</button></span>';
  });
  h += '</div></div>';
  h += '<div class="brow">';
  h += '<button class="btn bg bfw" onclick="closeDrawer()">Cancelar</button>';
  h += '<button class="btn bfw" style="background:'+p.cor+';color:#ffffff" onclick="saveFormProf()">\ud83d\udcbe Salvar</button>';
  h += '</div>';
  openDrawer(p.nome?'Editar professor / preceptor':'Novo professor / preceptor', h, p.cor);
}

function toggleDiaProf(d){
  var i=_fProf.dias.indexOf(d);
  if(i>=0) _fProf.dias.splice(i,1); else _fProf.dias.push(d);
  renderFormProf();
}
function addEstProf(){
  var v=(document.getElementById('fp-est')||{}).value||'';
  v=v.trim();
  if(v&&_fProf.estagiarios.indexOf(v)<0) _fProf.estagiarios.push(v);
  renderFormProf();
}
function delEstProf(e){
  _fProf.estagiarios=_fProf.estagiarios.filter(function(x){return x!==e;});
  renderFormProf();
}

function saveFormProf(){
  var nome=(document.getElementById('fp-nome')||{}).value||'';
  var cns=(document.getElementById('fp-cns')||{}).value||'';
  var inst=cleanTxt((document.getElementById('fp-inst')||{}).value||'');
  var curFinal=cleanTxt((document.getElementById('fp-cur')||{}).value||'');
  nome=nome.trim()||_fProf.nome;
  if(!nome){toast('Nome obrigat\u00f3rio!',false);return;}
  var data=Object.assign({},_fProf,{nome:nome,cns:cns.trim(),instituicao_parceira:inst,curso_preceptoria:curFinal});
  saveProfessorRecord(data).then(function(saved){
    var row=saved||data;
    mergeProfessorIntoState(row);
    closeDrawer(); toast('Professor salvo!'); renderHeader(); go(ST.tab);
  }).catch(function(e){toast('Erro: '+e.message,false);});
}

function delProf(id){
  showCfm('Excluir este professor? Todos os pacientes e sess\u00f5es vinculados ser\u00e3o removidos.',function(){
    sbDel('professores',id).then(function(){
      ST.profs=ST.profs.filter(function(p){return p.id!==id;});
      ST.patients=ST.patients.filter(function(p){return p.prof!==id;});
      ST.sessoes=ST.sessoes.filter(function(s){return s.prof!==id;});
      closeDrawer(); toast('Professor removido.'); renderHeader(); go(ST.tab);
    }).catch(function(e){toast('Erro: '+e.message,false);});
  });
}
