<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>Fisio SaaS · CER II</title>
<link rel="icon" href="data:,"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eef2f7;
  --bg-soft:#e8edf4;
  --surface:#ffffff;
  --surface-muted:#f8fafc;
  --panel:#ffffff;
  --panel-2:#f8fafc;
  --line:#e2e8f0;
  --line-soft:#e2e8f0;
  --text:#0f172a;
  --text-card:#1e293b;
  --muted:#64748b;
  --muted2:#475569;
  --brand:#0d9488;
  --brand-deep:#0f766e;
  --brand-soft:rgba(13,148,136,.12);
  --brand-ring:rgba(13,148,136,.28);
  --accent-doc:#0284c7;
  --ok:#059669;
  --warn:#d97706;
  --danger:#dc2626;
  --input-bg:#ffffff;
  --radius:12px;
  --radius-lg:16px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 16px 48px rgba(15,23,42,.09);
  --shadow-soft:0 1px 3px rgba(15,23,42,.06);
  /* Menu lateral escuro — sem texturas ou padrões */
  --nav-bg1:#0f1419;
  --nav-bg2:#1a2332;
  --nav-edge:rgba(255,255,255,.1);
  --nav-chip:rgba(255,255,255,.07);
  --nav-chip-brd:rgba(255,255,255,.11);
  --nav-label:#f1f5f9;
  --nav-meta:#94a3b8;
  --nav-item:#cbd5e1;
  --nav-item-hover:rgba(255,255,255,.1);
  --nav-item-active:rgba(13,148,136,.28);
  --nav-on-accent:rgba(94,234,212,.95);
}
html,body{
  min-height:100%;
  background:
    radial-gradient(ellipse 110% 85% at 50% -35%,rgba(13,148,136,.11),transparent 52%),
    linear-gradient(180deg,#fbfcfe 0%,var(--bg) 42%);
  color:var(--text);
  font-family:"DM Sans",system-ui,-apple-system,sans-serif;
  overflow-x:hidden;
  font-size:15px;
  line-height:1.52;
  -webkit-font-smoothing:antialiased;
}
input,select,textarea,button{font-family:inherit;color-scheme:light}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:24px}
#hdr{
  background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:12px;
  position:sticky;
  top:0;
  z-index:90;
  box-shadow:var(--shadow-soft);
}
.nav-brand-mark img{width:100%;height:100%;object-fit:contain;display:block;border-radius:inherit}
.hdr-context-rail{
  flex:1;
  display:none;
  align-items:center;
  justify-content:center;
  min-width:0;
}
.hdr-context-pill{
  max-width:100%;
  min-width:0;
  padding:7px 12px;
  border-radius:12px;
  border:1px solid rgba(13,148,136,.22);
  background:linear-gradient(125deg,rgba(13,148,136,.09),rgba(255,255,255,.94));
  box-shadow:0 1px 0 rgba(255,255,255,.85) inset,0 2px 10px rgba(13,148,136,.06);
}
.hdr-context-kicker{
  display:block;
  font-size:9px;
  font-weight:800;
  letter-spacing:.085em;
  text-transform:uppercase;
  color:var(--brand-deep);
  line-height:1.22;
}
.hdr-context-msg{
  display:block;
  margin-top:2px;
  font-size:12px;
  font-weight:600;
  color:#334155;
  line-height:1.38;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
@media(min-width:900px){
  .hdr-context-rail{display:flex!important}
}
.hdr-menu-btn{
  display:none;
  align-items:center;
  justify-content:center;
  width:42px;height:42px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--surface);
  cursor:pointer;
  flex-shrink:0;
  font-size:22px;
  line-height:1;
  color:var(--text);
  padding:0;
  box-shadow:var(--shadow-soft);
  -webkit-tap-highlight-color:transparent;
}
.hdr-menu-btn:active{transform:scale(.96)}
#nav-backdrop{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.45);
  z-index:94;
  -webkit-backdrop-filter:blur(2px);
  backdrop-filter:blur(2px);
}
body.nav-mob-open #nav-backdrop{display:block}
body.nav-mob-open #hdr{z-index:96}
#alert-bar{background:linear-gradient(90deg,#fffbeb,#fefce8);border-bottom:1px solid rgba(251,191,36,.45);padding:11px 18px;font-size:13px;color:#92400e;display:none;font-weight:600;line-height:1.45}
/* Mobile: menu lateral (sanduíche) — desktop redefine em min-width:900px */
#nav{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:min(292px,calc(100vw - 48px));
  max-width:292px;
  background:linear-gradient(165deg,var(--nav-bg1) 0%,var(--nav-bg2) 46%,var(--nav-bg1) 100%);
  border:1px solid var(--nav-edge);
  border-left:none;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  z-index:95;
  padding:18px 14px calc(18px + env(safe-area-inset-bottom));
  gap:12px;
  box-shadow:8px 0 36px rgba(0,0,0,.35);
  transform:translateX(-102%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  border-radius:0 var(--radius-lg) var(--radius-lg) 0;
}
body.nav-mob-open #nav{transform:translateX(0)}
.nav-brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-radius:14px;
  margin-bottom:2px;
  background:var(--nav-chip);
  border:1px solid var(--nav-chip-brd);
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
}
.nav-brand-mark{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(145deg,var(--brand),var(--brand-deep));
  box-shadow:0 4px 16px rgba(13,148,136,.42);
  flex-shrink:0;
  position:relative;
  overflow:hidden;
}
.nav-brand-mark.has-custom-logo{
  background:var(--surface);
  box-shadow:none;
  border:1px solid rgba(255,255,255,.15);
}
.nav-brand-title{font-size:15px;font-weight:700;color:var(--nav-label);letter-spacing:-.02em;line-height:1.2}
.nav-brand-sub{font-size:11px;color:var(--nav-meta);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.07em}
.nav-scroll{
  display:flex;
  flex-direction:column;
  flex:1;
  gap:4px;
  width:100%;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:rgba(148,163,184,.45) transparent;
}
.nav-scroll::-webkit-scrollbar{width:6px}
.nav-scroll::-webkit-scrollbar-thumb{background:rgba(148,163,184,.42);border-radius:99px}
.nb{
  flex:0;
  display:flex;
  flex-direction:row;
  justify-content:flex-start;
  align-items:center;
  gap:12px;
  width:100%;
  padding:12px 14px;
  border:none;
  background:transparent;
  cursor:pointer;
  border-radius:12px;
  color:var(--nav-item);
  transition:background .16s,color .16s;
  border-left:3px solid transparent;
}
.nb:hover{background:var(--nav-item-hover);color:var(--nav-label)}
.nb.on{color:var(--nav-on-accent);background:var(--nav-item-active);font-weight:700;border-left-color:var(--brand);box-shadow:0 6px 20px rgba(0,0,0,.22)}
.nb i{font-size:18px;display:block;line-height:1;font-style:normal;opacity:.95}
.nb span{font-size:13px;margin-top:0;font-weight:600;letter-spacing:.015em;display:block;font-style:normal}
@media(max-width:899px){
  .hdr-menu-btn{display:inline-flex}
}
#content{padding:20px 16px 0}
.scr{display:none;flex-direction:column;gap:20px}
.scr.on{display:flex}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow-soft);
}
.ch{
  padding:14px 18px;
  font-size:14px;
  font-weight:700;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--text-card);
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--surface-muted),var(--surface));
}
.field{display:flex;flex-direction:column;gap:6px;width:100%}
.field label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.field input,.field select,.field textarea{
  background:var(--input-bg);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  color:var(--text);
  font-size:14px;
  outline:none;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 3px var(--brand-soft);
}
.field textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:none;cursor:pointer;font-weight:600;border-radius:10px;padding:11px 18px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .15s;letter-spacing:.01em;font-family:inherit}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.bp{background:linear-gradient(180deg,var(--brand),var(--brand-deep));color:#fff;box-shadow:0 4px 16px rgba(13,148,136,.32)}
.bg{background:transparent;color:var(--brand-deep);border:1px solid var(--line)}
.br{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:7px 12px;font-size:12px}
.by{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.bd{background:var(--surface);color:var(--text-card);border:1px solid var(--line)}
.bsm{padding:8px 14px;font-size:12px;border-radius:8px}
.bfw{width:100%}
.brow{display:flex;gap:10px;flex-wrap:wrap}
.tag{border-radius:999px;padding:4px 11px;font-size:10px;font-weight:700;white-space:nowrap;display:inline-block}
.bar-w{background:#f1f5f9;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar-f{border-radius:99px;transition:width .35s ease}
#drw{position:fixed;inset:0;z-index:200;display:none}
#drw.on{display:block}
#drw-bg{position:absolute;inset:0;background:rgba(15,23,42,.48)}
#drw-pnl{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background:var(--surface);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  max-height:94vh;
  overflow-y:auto;
  box-shadow:var(--shadow);
  border:1px solid var(--line);
  border-bottom:none;
}
#drw-hd{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  background:rgba(255,255,255,.96);
  z-index:1;
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
}
#drw-ttl{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-.02em}
#drw-x{background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1;width:40px;height:40px;border-radius:10px}
#drw-x:hover{background:var(--surface-muted);color:var(--text)}
#drw-bd{padding:20px 20px 44px;display:flex;flex-direction:column;gap:14px}
#cfm{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#cfm.on{display:flex}
#cfm-bg{position:absolute;inset:0;background:rgba(15,23,42,.52)}
#cfm-box{
  position:relative;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:26px;
  max-width:380px;
  width:100%;
  z-index:1;
  box-shadow:var(--shadow);
}
#cfm-msg{font-size:14px;color:var(--text-card);margin-bottom:20px;line-height:1.55}
#tst{
  position:fixed;
  bottom:96px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 20px;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
  z-index:400;
  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
  max-width:92vw;
  white-space:normal;
  text-align:center;
  box-shadow:var(--shadow);
}
#ldg{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;gap:18px}
.spin{width:42px;height:42px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .85s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#ldg-msg{font-size:15px;color:var(--muted);text-align:center;padding:0 24px;line-height:1.6;max-width:360px}
#auth{position:fixed;inset:0;background:var(--bg);z-index:450;display:none;align-items:center;justify-content:center;padding:20px}
#auth.on{display:flex}
#auth-box{
  width:min(420px,100%);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:28px;
  display:flex;
  flex-direction:column;
  gap:16px;
  box-shadow:var(--shadow);
}
.auth-brand{display:flex;align-items:center;gap:14px}
.auth-brand-mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--brand),var(--brand-deep));box-shadow:0 8px 26px rgba(13,148,136,.28);flex-shrink:0}
#auth-box h1{font-size:22px;color:var(--text);line-height:1.2;font-weight:700;letter-spacing:-.03em}
#auth-box p{font-size:13px;color:var(--muted);line-height:1.55}
.clinical-label{display:block;font-size:11px;font-weight:700;color:var(--muted2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.clinical-sub{font-size:13px;line-height:1.55;color:var(--muted);margin-top:4px;max-width:52ch}
.page-hero{
  background:linear-gradient(135deg,#ffffff 0%,#f8fafc 46%,#f1f5f9 100%);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:20px 22px;
  box-shadow:var(--shadow-soft);
  position:relative;
  overflow:hidden;
}
.page-hero::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 100% 0%,rgba(13,148,136,.14),transparent 52%);
  pointer-events:none;
}
.page-hero.compact{padding:16px 20px}
.page-hero h1{font-size:1.38rem;font-weight:700;color:var(--text);line-height:1.22;position:relative;letter-spacing:-.03em}
.page-hero.compact h1{font-size:1.14rem}
.saas-hero{
  background:linear-gradient(135deg,#ffffff 0%,#f8fafc 100%);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:20px 22px;
  display:grid;
  gap:12px;
  box-shadow:var(--shadow-soft);
}
.saas-hero h1{font-size:1.28rem;line-height:1.22;color:var(--text);font-weight:700;letter-spacing:-.03em}
.saas-hero p{font-size:13px;line-height:1.58;color:var(--muted)}
.saas-metric{background:var(--surface-muted);border:1px solid var(--line);border-radius:12px;padding:14px}
.clinical-hero-inner{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;position:relative}
.pacs-shell{display:flex;flex-direction:column;gap:16px;width:100%;min-width:0}
.pacs-hero-mini{
  padding:17px 20px;border-radius:var(--radius-lg);border:1px solid var(--line);
  background:
    radial-gradient(ellipse 90% 80% at 100% -40%,rgba(13,148,136,.09),transparent 55%),
    linear-gradient(180deg,#ffffff,var(--surface-muted));
  box-shadow:var(--shadow-soft);
}
.pacs-hero-mini h1{font-size:clamp(1.12rem,2.6vw,1.34rem);font-weight:800;letter-spacing:-.035em;color:var(--text);margin:0 0 6px;line-height:1.18}
.pacs-hero-mini p{font-size:13px;color:var(--muted);line-height:1.46;margin:0;max-width:58ch;font-weight:500}

.pacs-parceira-slot .card{border-radius:14px;margin:0!important}
.pacs-parceira-slot .dash-chip-scroll{font-size:12px}

.pacs-toolbar{display:flex;flex-direction:column;gap:13px;width:100%;min-width:0}
.pacs-toolbar-card{
  padding:17px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-soft);
}
.pacs-toolbar-row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;width:100%}
.pacs-toolbar-row--search{display:flex;flex-wrap:wrap;gap:10px;width:100%;align-items:center}
.pacs-toolbar-row--search .search-field{flex:1 1 min(260px,100%);min-height:46px;margin:0}
.pacs-toolbar-row--filters{align-items:flex-start}
.pacs-profs-strip{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pacs-profs-strip .dash-chip{font-size:12px;padding:9px 16px}
.pacs-select-est{
  flex:1 1 min(160px,100%);padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--input-bg);
  font-size:13px;font-weight:600;color:var(--text-card);font-family:inherit;outline:none;max-width:100%;
}
.pacs-select-est:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

.pacs-count-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-top:13px;margin-top:2px;border-top:1px solid var(--line)}
.pacs-count-bar .mono{font-variant-numeric:tabular-nums}
.pacs-count-lbl{font-size:13px;font-weight:700;color:var(--muted2)}
.pacs-count-lbl strong{color:var(--text-card);font-size:22px;display:inline-block;margin-left:8px;font-weight:800;letter-spacing:-.03em;line-height:1}

.pacs-adv-wrap{border-top:1px solid var(--line);margin-top:4px;padding-top:14px}
.pacs-adv-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.pacs-adv-toggle{
  display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface-muted);color:var(--text-card);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
  transition:border-color .16s,background .16s,transform .12s;text-align:left;
}
.pacs-adv-toggle[disabled]{opacity:.82;cursor:not-allowed}
.pacs-count-lbl{margin:0}
.pacs-adv-toggle:hover{border-color:rgba(13,148,136,.38);background:rgba(13,148,136,.06)}
.pacs-adv-badge{
  min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;border-radius:999px;
  font-size:11px;font-weight:800;background:linear-gradient(180deg,var(--brand),var(--brand-deep));color:#fff;
}
.pacs-adv-panel{display:flex;flex-direction:column;gap:14px}
.pacs-adv-muted{font-size:12px;color:var(--muted);font-weight:600}

.pacs-filters-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.pacs-filters-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:980px){.pacs-filters-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}}
@media(min-width:1280px){.pacs-filters-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pacs-filters-grid .field{margin:0;gap:5px}
.pacs-filters-grid .field label{font-size:10px;color:var(--muted);letter-spacing:.05em;font-weight:800}
.pacs-filters-grid input[type="date"],.pacs-filters-grid select{border-radius:10px;width:100%;font-size:14px;font-weight:500}
.pacs-filters-chk{
  display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;margin-top:2px;font-size:12px;color:var(--muted2);font-weight:600;
  padding:12px;border-radius:12px;background:var(--surface-muted);border:1px solid var(--line);
}
.pacs-filters-chk label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;-webkit-user-select:none;user-select:none;line-height:1.35}
.pacs-filters-chk input{width:17px;height:17px;margin:0;accent-color:var(--brand)}
.pacs-filters-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:2px}

.pacs-empty{

<script>
// \u2500\u2500 CREDENCIAIS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
var APP_CFG = window.__FISIO_CONFIG__ || {};
var SB_URL = APP_CFG.supabaseUrl || '';
var SB_KEY = APP_CFG.supabaseAnonKey || '';
var CORE = window.FisioCore || null;
function configMissingHelpHtml(){
  return CORE && typeof CORE.configMissingHelpHtml === 'function'
    ? CORE.configMissingHelpHtml()
    : '\u274c Configura\u00e7\u00e3o n\u00e3o encontrada<br><br>' +
      '<span style="color:#64748b;font-size:12px">Crie/edite o arquivo <b>config.js</b> com as credenciais do Supabase.<br>Use <b>config.example.js</b> como modelo.</span>';
}
if(window.FisioObservability) window.FisioObservability.init();

// \u2500\u2500 ESTADO \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
var ST = window.FisioStore ? window.FisioStore.createInitialState() : { profs:[], patients:[], sessoes:[], tab:'dash', session:null };
var AUTH = window.createFisioAuthHandlers ? window.createFisioAuthHandlers({
  authReq: function(path, body){ return authReq(path, body); },
  setSession: function(s){ return setSession(s); },
  getSession: function(){ return getSession(); },
  loadAll: function(){ return loadAll(); },
  clearData: function(){ return window.FisioStore ? window.FisioStore.resetCollections(ST) : (ST.profs=[], ST.patients=[], ST.sessoes=[], ST); },
  setLoading: function(on, msg){ return setLoading(on, msg); }
}) : null;
var DATA = window.createFisioDataHandlers ? window.createFisioDataHandlers({
  coreReq: function(method, path, session, body, extraHeaders){
    if(CORE) return CORE.sbReq(method, path, session, body, extraHeaders);
    if(!hasSupabaseConfig()) return Promise.reject(new Error('Configuração ausente: preencha config.js com supabaseUrl e supabaseAnonKey.'));
    if(!session || !session.access_token) return Promise.reject(new Error('Sessão inválida. Entre novamente.'));
    var opts = { method: method, headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer '+session.access_token, 'Content-Type': 'application/json', 'Prefer': 'return=representation' } };
    if(extraHeaders) Object.keys(extraHeaders).forEach(function(k){ opts.headers[k] = extraHeaders[k]; });
    if(body) opts.body = JSON.stringify(body);
    return fetch(SB_URL+'/rest/v1/'+path, opts).then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(t); }); return r.text().then(function(t){ return t ? JSON.parse(t) : []; }); });
  },
  getSession: function(){ return getSession(); },
  getState: function(){ return ST; },
  hasSupabaseConfig: function(){ return hasSupabaseConfig(); },
  getSessionFromStorage: function(){ return getSession(); },
  sessionExpired: function(s){ return sessionExpired(s); },
  refreshSession: function(){ return refreshSession(); },
  authLogout: function(){ return authLogout(); },
  authMessage: function(msg, ok){ return authMessage(msg, ok); },
  setLoading: function(on, msg){ return setLoading(on, msg); },
  showAuth: function(){ return document.getElementById('auth').classList.add('on'); },
  hideAuth: function(){ return document.getElementById('auth').classList.remove('on'); },
  renderHeader: function(){ return renderHeader(); },
  renderAlerts: function(){ return renderAlerts(); },
  go: function(id){ return go(id); },
  esc: function(v){ return esc(v); },
  toast: function(msg, ok){ return toast(msg, ok); },
  normName: function(v){ return normName(v); },
  configMissingHelpHtml: function(){ return configMissingHelpHtml(); }
}) : null;

// \u2500\u2500 CONSTANTES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
var HORARIOS   = ['07:30','08:10','08:50','09:30','10:10','10:50','11:30','13:00','13:40','14:20'];
var DIAS_SEQ   = ['SEG','TER','QUA','QUI','SEX'];
var DIAS_LBL   = {SEG:'Segunda',TER:'Ter\u00e7a',QUA:'Quarta',QUI:'Quinta',SEX:'Sexta'};
var DIAS_NUM   = {SEG:1,TER:2,QUA:3,QUI:4,SEX:5};
function diasListaLegivel(arr){
  if(!arr||!arr.length) return '';
  return arr.map(function(d){ return DIAS_LBL[d]||d; }).join(', ');
}
var MESES_PT   = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
var ORIGENS    = ['VE','R','RE','GT','NISA','GR'];
var ORIG_COR   = {VE:'#0d9488',R:'#7c3aed',RE:'#d97706',GT:'#059669',GR:'#059669',NISA:'#ea580c'};
/** R\u00f3tulo amig\u00e1vel para exibi\u00e7\u00e3o (valor salvo no cadastro continua sendo o c\u00f3digo). */
var ORIGEM_LBL = {VE:'Vale Exame',RE:'Regula\u00e7\u00e3o',R:'Conv\u00eanio (R)',GT:'Gest\u00e3o territorial (GT)',GR:'Grupo (GR)',NISA:'NISA'};
function origemExibir(cod){
  var o=String(cod==null?'':cod).trim();
  if(!o) return '';
  var u=o.toUpperCase();
  if(ORIGEM_LBL[u]) return ORIGEM_LBL[u];
  if(ORIGEM_LBL[o]) return ORIGEM_LBL[o];
  return 'Origem '+u;
}
/** Política de alta por origem — persistida em localStorage (este navegador). */
function defaultPoliticaAlta(){
  return {
    RE:{ mesesEncerramento:6, avisarDiasAntes:[120,90,60,30], calcAutoAlta:true },
    VE:{ mesesEncerramento:6, avisarDiasAntes:[120,90,60,30], calcAutoAlta:true }
  };
}
function politicaAlta(){
  var def = defaultPoliticaAlta();
  try{
    var raw = localStorage.getItem('fisio_politica_alta');
    if(!raw) return def;
    var o = JSON.parse(raw);
    ['RE','VE'].forEach(function(k){
      if(!o[k]||typeof o[k]!=='object') o[k]=JSON.parse(JSON.stringify(def[k]));
      else{
        o[k].mesesEncerramento = Math.max(1,Math.min(36,parseInt(o[k].mesesEncerramento,10)||def[k].mesesEncerramento));
        if(!Array.isArray(o[k].avisarDiasAntes)||!o[k].avisarDiasAntes.length) o[k].avisarDiasAntes = def[k].avisarDiasAntes.slice();
        o[k].avisarDiasAntes = o[k].avisarDiasAntes.map(function(n){ return parseInt(n,10)||0; }).filter(function(n){ return n>0; }).sort(function(a,b){ return b-a; });
        if(!o[k].avisarDiasAntes.length) o[k].avisarDiasAntes = def[k].avisarDiasAntes.slice();
        if(o[k].calcAutoAlta===undefined) o[k].calcAutoAlta = true;
      }
    });
    return o;
  }catch(e){ return def; }
}
function salvarPoliticaAlta(){
  var diasOpts=[120,90,60,30];
  function ler(orig){
    var meses = Math.max(1,Math.min(36,parseInt((document.getElementById('cfg-pol-'+orig+'-meses')||{}).value,10)||6));
    var avis=[];
    diasOpts.forEach(function(d){
      var el=document.getElementById('cfg-pol-'+orig+'-d'+d);
      if(el&&el.checked) avis.push(d);
    });
    if(!avis.length) avis=diasOpts.slice();
    var autoEl=document.getElementById('cfg-pol-'+orig+'-auto');
    return { mesesEncerramento:meses, avisarDiasAntes:avis.sort(function(a,b){ return b-a; }), calcAutoAlta: !!(autoEl&&autoEl.checked) };
  }
  var pol={ RE:ler('RE'), VE:ler('VE') };
  localStorage.setItem('fisio_politica_alta', JSON.stringify(pol));
  toast('Política de alta salva neste navegador.');
  go('cfg');
}
function addMesesIso(iso, meses){
  if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso)||meses==null||meses<=0) return '';
  var p = iso.split('-').map(Number);
  var d = new Date(p[0], p[1]-1+meses, p[2]);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function diasRestantesAte(isoEnd){
  if(!isoEnd||!/^\d{4}-\d{2}-\d{2}$/.test(isoEnd)) return null;
  var e = new Date(isoEnd+'T12:00:00').getTime();
  var t = new Date(); t.setHours(12,0,0,0);
  return Math.ceil((e-t)/86400000);
}
function diasDecorridosDesde(isoStart){
  if(!isoStart||!/^\d{4}-\d{2}-\d{2}$/.test(isoStart)) return null;
  var s = new Date(isoStart+'T12:00:00').getTime();
  var t = new Date(); t.setHours(12,0,0,0);
  return Math.floor((t-s)/86400000);
}
function calcAltaPrevistaPolitica(admIso, orig){
  if(!admIso||!/^\d{4}-\d{2}-\d{2}$/.test(admIso)) return '';
  var o = String(orig||'').toUpperCase();
  if(o!=='RE'&&o!=='VE') return '';
  var pol = politicaAlta();
  var cfg = pol[o]||pol.RE;
  if(cfg.calcAutoAlta===false) return '';
  return addMesesIso(admIso, cfg.mesesEncerramento);
}
function pacienteEmAlertaAltaTemporal(p){
  if(!p||!p.ativo) return false;
  var o = String(p.orig||'').toUpperCase();
  if(o!=='RE'&&o!=='VE') return false;
  var alta=p.alta;
  if(!alta||!/^\d{4}-\d{2}-\d{2}$/.test(alta)) return false;
  var rest=diasRestantesAte(alta);
  if(rest===null) return false;
  if(rest<0) return true;
  var pol=politicaAlta();
  var cfg=pol[o]||pol.RE;
  var th=cfg.avisarDiasAntes||[];
  return th.some(function(d){ return rest<=d; });
}
function recalcAltaPacForm(){
  var autoEl=document.getElementById('f-auto-alta');
  if(autoEl&&!autoEl.checked){ refreshPacFormTimeline(); return; }

function refreshPacFormTimeline(){

  var alta=(document.getElementById('f-alta')||{}).value||'';
  var orig=(document.getElementById('f-orig')||{}).value||'RE';
  var oUp=String(orig).toUpperCase();
  var cfg=(oUp==='RE'||oUp==='VE')?(politicaAlta()[oUp]||politicaAlta().RE):null;

  if(adm&&/^\d{4}-\d{2}-\d{2}$/.test(adm)){
    var dd=diasDecorridosDesde(adm);
    if(dd!=null) lines.push('Tempo desde admissão: '+dd+' dia(s) · '+fmtD(adm)+'.');
  } else lines.push('Informe a data de admissão para acompanhar o ciclo.');
  if(alta&&/^\d{4}-\d{2}-\d{2}$/.test(alta)){
    var dr=diasRestantesAte(alta);

      if(dr<0) lines.push('Alta prevista '+fmtD(alta)+': prazo ultrapassado há '+Math.abs(dr)+' dia(s).');

function pacientePorIdMap(patMap, pid){
  if(pid==null||pid===''||!patMap) return null;

  var sp=String(pid);
  for(var k in patMap){
    if(Object.prototype.hasOwnProperty.call(patMap,k)&&String(k)===sp) return patMap[k];
  }
  return null;
}

  if(!s||!s.pid||!patMap) return false;
  var p=pacientePorIdMap(patMap,s.pid);
  if(!p) return false;
  var pp=String(p.prof==null?'':p.prof).trim();
  if(!pp) return true;
  return String(s.prof||'')===String(p.prof||'');

// \u2500\u2500 SUPABASE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function sbReq(method, path, body, extraHeaders) {
  if(DATA) return DATA.sbReq(method, path, body, extraHeaders);
  if(CORE) return CORE.sbReq(method, path, ST.session, body, extraHeaders);
  if(!hasSupabaseConfig()) return Promise.reject(new Error('Configuração ausente: preencha config.js com supabaseUrl e supabaseAnonKey.'));
  if(!authToken()) return Promise.reject(new Error('Sessão inválida. Entre novamente.'));
  var opts = {
    method: method,
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer '+authToken(),
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    }
  };
  if(extraHeaders) Object.keys(extraHeaders).forEach(function(k){ opts.headers[k]=extraHeaders[k]; });
  if (body) opts.body = JSON.stringify(body);
  return fetch(SB_URL+'/rest/v1/'+path, opts).then(function(r) {
    if (!r.ok) return r.text().then(function(t){ throw new Error(t); });
    return r.text().then(function(t){ return t ? JSON.parse(t) : []; });
  });
}
function sbGet(t)      { return sbReq('GET',    t+'?order=created_at.asc'); }
function sbIns(t,d)    { return sbReq('POST',   t, d); }
function sbUpd(t,id,d) { return sbReq('PATCH',  t+'?id=eq.'+id, d); }
function sbDel(t,id)   { return sbReq('DELETE', t+'?id=eq.'+id); }
function sbUpsert(t,d,key){ return sbReq('POST', t+'?on_conflict='+key, d, {'Prefer':'resolution=merge-duplicates,return=representation'}); }

function parsePostgrestPayloadIdx(err){
  var t = String((err && err.message) || '');
  try{
    var o = JSON.parse(t);
    return {
      raw: t,
      code: String(o.code || '').toUpperCase(),
      msg: String(o.message || ''),
      hint: String(o.hint || ''),
      detail: String(o.details != null && o.details !== '' ? o.details : (o.detail || ''))
    };
  }catch(e){ return { raw: t, code: '', msg: t, hint: '', detail: '' }; }
}
function shouldRetryProfessorPatchWithoutMetaColumnsIdx(body,err){
  if(!body)return false;
  if(!Object.prototype.hasOwnProperty.call(body,'instituicao_parceira')&&!Object.prototype.hasOwnProperty.call(body,'curso_preceptoria'))return false;
  var p = parsePostgrestPayloadIdx(err);
  var blob = ((p.msg||'')+' '+(p.hint||'')+' '+(p.detail||'')+' '+(p.raw||'')).toLowerCase();
  if(blob.indexOf('instituicao_parceira')>=0)return true;
  if(blob.indexOf('curso_preceptoria')>=0)return true;
  if(blob.indexOf("'cns' column")>=0||blob.indexOf('the \'cns\' column')>=0||(blob.indexOf('cns')>=0&&blob.indexOf('could not find')>=0&&blob.indexOf('instituicao_parceira')<0&&blob.indexOf('curso_preceptoria')<0))return false;
  if(blob.indexOf('42703')>=0||blob.indexOf('undefined_column')>=0){
    if(blob.indexOf('instituicao_parceira')>=0||blob.indexOf('curso_preceptoria')>=0)return true;
  }
  if(p.code==='PGRST204'||blob.indexOf('pgrst204')>=0){
    if(blob.indexOf('professores')>=0&&blob.indexOf('could not find')>=0&&blob.indexOf('column')>=0){
      if(blob.indexOf('instituicao_parceira')>=0||blob.indexOf('curso_preceptoria')>=0)return true;
    }
  }
  return false;
}

/** Mensagem baixa dos erros Retool/Postgres/PostgREST (texto pode ser JSON). */
function erroBlobLowerFromSupabase(msg){
  var raw = String(msg||'');
  try{
    var o = JSON.parse(raw);
    return ((o.message!=null?String(o.message):'')+' '+(JSON.stringify(o))+' '+(o.hint||'')+' '+(String(o.details||o.detail||''))).toLowerCase();
  }catch(e){ return raw.toLowerCase(); }
}
/** Coluna inexistente no cache do PostgREST ou no Postgres (42703). */
function erroSchemaPacienteMissingColumn(msg, col){
  var low = erroBlobLowerFromSupabase(msg);
  var cn = String(col||'').toLowerCase();
  if(low.indexOf(cn)<0) return false;
  return (
    low.indexOf('pgrst204')>=0 || low.indexOf('schema cache')>=0 ||
    low.indexOf('42703')>=0 ||
    (low.indexOf('could not find')>=0 && low.indexOf('column')>=0) ||
    (low.indexOf('does not exist')>=0 && low.indexOf('column')>=0) ||
    (low.indexOf('undefined_column')>=0)
  );
}
function erroSchemaPacienteSemCodProcedimento(msg){
  if(erroSchemaPacienteMissingColumn(msg,'cod_procedimento')) return true;
  var low = erroBlobLowerFromSupabase(msg);
  return low.indexOf('cod_procedimento')>=0 && (
    low.indexOf('42703')>=0 || low.indexOf('could not find')>=0 ||
    low.indexOf('does not exist')>=0 || low.indexOf('pgrst204')>=0 ||
    low.indexOf('schema cache')>=0

function hashExcelImportBuffer(buf){

      return crypto.subtle.digest('SHA-256', buf).then(function(d){
        return Array.from(new Uint8Array(d)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      });
  }catch(e){}
  var u8 = new Uint8Array(buf);
  var n = u8.length, h = 2166136261;

/** Uma linha por paciente+professor: evita vários cadastros para o mesmo nome (várias colunas de estagiário). */
function dedupeImportAgendaPatients(patients){
  if(!patients || !patients.length) return patients;
  var map = {};
  function mergeObs(a, b){
    var parts = [a, b].filter(Boolean).join(' | ').split(/\s*\|\s*/);
    var u = {}, out = [];
    parts.forEach(function(x){
      x = String(x || '').trim();
      if(x && !u[x]){ u[x] = true; out.push(x); }
    });
    return out.join(' | ');
  }
  patients.forEach(function(p){
    var key = normName(p.nome) + '\t' + String(p.prof || '');
    var cur = map[key];
    var pReal = parseInt(p.real, 10) || 0;
    if(!cur){
      map[key] = Object.assign({}, p);
      map[key]._impBestReal = pReal;
      return;
    }
    cur.real = Math.max(parseInt(cur.real, 10) || 0, pReal);
    if(pReal > (cur._impBestReal || 0)){
      cur._impBestReal = pReal;
      if(p.hor) cur.hor = p.hor;
      if(p.est) cur.est = p.est;
    }
    cur.presc = Math.max(1, Math.min(500, Math.max(parseInt(cur.presc, 10) || 20, parseInt(p.presc, 10) || 20)));
    ['cid', 'cod_procedimento', 'diag', 'tel', 'adm', 'alta'].forEach(function(f){
      var cv = cur[f], pv = p[f];
      var cs = cv == null ? '' : String(cv).trim();
      if(!cs && pv != null && String(pv).trim()) cur[f] = pv;

    var co = cur.orig, po = p.orig;
    if(!(co != null && String(co).trim()) && po != null && String(po).trim()) cur.orig = po;
    cur.obs = mergeObs(cur.obs, p.obs);
    if(!cur.hor && p.hor) cur.hor = p.hor;
    if(!cur.est && p.est) cur.est = p.est;
  });
  return Object.keys(map).map(function(k){
    var row = map[k];
    delete row._impBestReal;
    return row;
  });

function firstTime(v){ var m=String(v||'').match(/(\d{2}):(\d{2})/); return m?m[1]+':'+m[2]:''; }
function isoFromBrDate(v){
  var m=String(v||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(!m) return '';
  var y=m[3].length===2?'20'+m[3]:m[3];
  return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
}
function isoFromMonthYear(v){
  var m=String(v||'').match(/^(\d{1,2})\/(\d{2,4})$/);
  if(!m) return '';
  var y=m[2].length===2?'20'+m[2]:m[2];
  return y+'-'+String(m[1]).padStart(2,'0')+'-01';
}
function addDaysIso(iso,n){
  var isoF = iso&&/^\d{4}-\d{2}-\d{2}$/.test(iso)?iso:today();
  var p = isoF.split('-').map(Number);
  var d = new Date(p[0],p[1]-1,p[2]+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function padYmPart(n){ return String(n).padStart(2,'0'); }
function mpYmKey(year,month){ return year+'-'+padYmPart(month); }
/** "MP 04.2026", "MP4.26", "MP: 04 / 2026" (texto extra à direita ignorado) → {year,month,key} ou null */
function parseMpSheetTitle(name){
  var m = String(name||'').trim().match(/^MP\s*[:\s.]?\s*(\d{1,2})\s*[.\/\s]+\s*(\d{2,4})\b/i);
  if(!m) return null;
  var mo = parseInt(m[1],10);
  var yr = parseInt(m[2],10);
  if(yr>=0&&yr<100) yr += 2000;
  if(mo<1||mo>12||yr<1900||yr>2100) return null;
  return { year:yr, month:mo, key: mpYmKey(yr, mo) };
}
function excelSerialToIso(n){
  if(typeof n!=='number'||!(n>1)) return '';
  try {
    var dt = typeof XLSX!=='undefined'&&XLSX.SSF&&typeof XLSX.SSF.parse_date_code==='function' ? XLSX.SSF.parse_date_code(n) : null;
    if(dt&&dt.y) return dt.y+'-'+padYmPart(dt.m)+'-'+padYmPart(dt.d);
  }catch(e){}
  return '';
}
/** Cabeçalho de data (DD/MM/AAAA, objeto Date, serial Excel, apenas dia dentro do MM/AAAA da aba) */
function headerCellToMpDate(cell, year, month){
  if(cell instanceof Date&&!isNaN(cell.getTime())){
    var y=cell.getFullYear(), mm=cell.getMonth()+1, dd=cell.getDate();
    if(y===year&&mm===month) return y+'-'+padYmPart(mm)+'-'+padYmPart(dd);
    return '';
  }
  var s=cleanTxt(cell);
  if(!s&&!cell&&cell!==0) return '';
  var br=isoFromBrDate(s);
  if(br&&(br.slice(0,7)===mpYmKey(year,month))) return br;
  var num=typeof cell==='number'?cell:(parseFloat(s.replace(',','.'))||NaN);
  if(!isNaN(num)&&(String(s).trim()===''||s===(num+'')||(typeof cell==='number'))){
    var xl=excelSerialToIso(num);
    if(xl&&(xl.slice(0,7)===mpYmKey(year,month))) return xl;
  }
  var day=/^(\d{1,2})$/.exec(s);
  if(day){
    var d0=parseInt(day[1],10);
    if(d0>=1&&d0<=31){
      var test=new Date(year,month-1,d0);
      if(test.getMonth()===month-1&&test.getDate()===d0) return year+'-'+padYmPart(month)+'-'+padYmPart(d0);
    }
  }
  return '';
}
function findMpDateColumns(rows, ym){
  var monthKey=ym.key, best=null, bestN=0;
  for(var hr=0; hr<Math.min(rows.length,20); hr++){
    var row = rows[hr]||[];
    var cols=[];
    for(var c=0; c<row.length; c++){
      var iso = headerCellToMpDate(row[c], ym.year, ym.month);
      if(iso&&iso.slice(0,7)===monthKey) cols.push({ col:c, iso:iso });
    }
    if(cols.length>bestN){ bestN=cols.length; best={ headerRow:hr, cols:cols }; }
  }
  if(best&&bestN>=4) return best;
  if(best&&bestN>=2) return best;
  return null;
}
/** Presença na grade MP: apenas 1 (ou 1.0). Vazio/zero = falta neste projeto. */
function mpCellIsPresent(raw){
  if(raw===null||raw===undefined) return false;
  if(typeof raw==='boolean') return raw===true;
  if(typeof raw==='number') return raw===1;
  var s=cleanTxt(String(raw));
  return s==='1'||s==='1.0'||s==='1,0';
}

function extractMpAttendanceFlatSheet(rows, ym, sheetName, patientsForEst, defaultProfSlug){
  var di = findMpDateColumns(rows, ym);
  if(!di||!di.cols.length) return [];
  var dateCols = di.cols;
  var nameColCandidates=[0,1,2];
  var out=[];
  var MP_FLAT_MAX_SCAN = 900;
  var MP_FLAT_EMPTY_STREAK_ABORT = 50;
  var maxR = Math.min(rows.length - 1, di.headerRow + MP_FLAT_MAX_SCAN);
  var emptyStreak = 0;
  for(var r=di.headerRow+1; r<=maxR; r++){
    var row = rows[r]||[];
    var nome='', nameCol=-1;
    for(var ni=0; ni<nameColCandidates.length; ni++){
      var cc=nameColCandidates[ni];
      var cand=cleanTxt(row[cc]);
      if(!cand) continue;
      if(/^(paciente|nome|total|obs|prof)/i.test(cand)) continue;
      if(firstTime(cand)===cand&&/^\d{2}:\d{2}$/.test(firstTime(cand))) continue;
      if(cand.length<3) continue;
      nome=cand; nameCol=cc; break;
    }
    if(!nome){
      emptyStreak++;
      if(emptyStreak>=MP_FLAT_EMPTY_STREAK_ABORT) break;
      continue;
    }
    emptyStreak = 0;
    var hit = (patientsForEst||[]).find(function(p){ return normName(p.nome)===normName(nome); });
    var prof = hit&&hit.prof?hit.prof:String(defaultProfSlug||'leandro');
    var est = hit&&hit.est!=null?String(hit.est):'';
    var nn=normName(nome);
    dateCols.forEach(function(dc){
      var raw = row[dc.col];
      out.push({ sheet:sheetName, nome:nome, nomeNorm:nn, orig:(hit&&hit.orig)||'RE', prof:prof, est:est, hor:'', data:dc.iso, status:mpCellIsPresent(raw)?'P':'F' });
    });
  }
  return out;
}
function extractMpAttendanceFromWorkbook(wb, sections, patientsSoFar){

/** Inclui pacientes aparecendo só nas abas MP; devolve objeto contadores de presença por nome. */

/** Carrega todas as sessões dos pacientes (paginado); evita 1 GET por célula na importação MP. */
function fetchAllSessoesForPids(pids){
  var uniq=[];
  var u={};
  (pids||[]).forEach(function(id){ if(id&&!u[id]){ u[id]=true; uniq.push(id); } });
  if(!uniq.length) return Promise.resolve([]);
  var PID_CHUNK = 24;
  var PAGE = 1000;
  function loadPidSubset(sub){
    var inList = sub.join(',');
    function page(off){
      var q='pid=in.('+inList+')&select=id,pid,prof,data,status,est,obs&order=created_at.asc&limit='+PAGE+'&offset='+off;
      return sbReq('GET','sessoes?'+q).then(function(rows){
        var arr=Array.isArray(rows)?rows:[];
        if(arr.length<PAGE) return arr;
        return page(off+PAGE).then(function(rest){ return arr.concat(rest); });
      });
    }
    return page(0);
  }
  var i=0;
  function nextAcc(acc){
    if(i>=uniq.length) return Promise.resolve(acc);
    var sub=uniq.slice(i,i+PID_CHUNK);
    i+=PID_CHUNK;
    return loadPidSubset(sub).then(function(part){ return nextAcc(acc.concat(part)); });
  }
  return nextAcc([]);
}
/** Atualiza/insere sessão usando mapa pré-carregado (chave pid+prof+data+est). */
function upsertSessaoFromMpCached(row, sessaoByKey){
  var estW=String(row.est||'');
  var k=sessaoMpIndexKey(row.pid,row.prof,row.data,estW);
  var hit=sessaoByKey[k];
  var body={ pid:row.pid, prof:row.prof, data:row.data, status:row.status, est:estW, obs:String(row.obs||'') };
  if(hit){
    return sbUpd('sessoes', hit.id, body).then(function(){
      sessaoByKey[k]=Object.assign({}, hit, body);
      return { op:'upd' };
    }).catch(function(err){
      return Promise.reject(err);
    });
  }
  var nid=newSessaoId();
  return sbIns('sessoes', Object.assign({ id:nid }, body)).then(function(res){
    var row0=firstSbRow(res)||Object.assign({ id:nid }, body);
    sessaoByKey[k]=row0;
    return { op:'ins' };
  });
}
function upsertMpSessoesImported(mpRows, resolvePidProf){
  if(!mpRows||!mpRows.length) return Promise.resolve({ inserted:0, updated:0, skipped:0, errors:[] });
  var merged = dedupeMpAttendanceRows(mpRows);
  var resolved=[];
  merged.forEach(function(tpl){
    var r=resolvePidProf(tpl);
    if(r&&looksLikeUuid(r.pid)&&looksLikeUuid(r.prof))
      resolved.push({ tpl:tpl, pid:r.pid, prof:r.prof });
  });
  var total = merged.length;
  var skippedEarly = merged.length-resolved.length;
  var iq=0, uq=0, sk=skippedEarly, errors=[];
  var CONC = 18;
  var pos = 0;
  var pids=[];
  resolved.forEach(function(x){ if(pids.indexOf(x.pid)<0) pids.push(x.pid); });

  function runWithMap(byKey){
    function oneRow(pair){
      var tpl = pair.tpl;
      return upsertSessaoFromMpCached({
        pid:pair.pid, prof:pair.prof, est:tpl.est, data:tpl.data, status:tpl.status, obs:''
      }, byKey).then(function(res){
        if(res&&res.op==='ins') return { k:'ins' };
        if(res&&res.op==='upd') return { k:'upd' };
        return { k:'ok' };
      }).catch(function(err){
        return { k:'err', msg:String(err&&err.message||err) };
      });
    }
    function loop(){
      if(pos>=resolved.length)
        return Promise.resolve({ inserted:iq, updated:uq, skipped:sk, errors:errors });
      var end=Math.min(pos+CONC, resolved.length);
      var chunk=resolved.slice(pos,end);
      pos=end;
      setLoading(true, 'Gravando presen\u00e7as e faltas (abas MP)... '+Math.min(pos,resolved.length)+' / '+resolved.length+
        (skippedEarly ? ' \u2022 '+skippedEarly+' linha(s) sem paciente/UUID no sistema' : ''));
      return Promise.all(chunk.map(oneRow)).then(function(results){
        results.forEach(function(z){
          if(!z) return;
          if(z.k==='ins') iq++;
          else if(z.k==='upd') uq++;
          else if(z.k==='err'&&z.msg) errors.push(z.msg);
        });
        return new Promise(function(r){ setTimeout(function(){ r(loop()); }, 0); });
      });
    }
    return loop();
  }

  if(!resolved.length)
    return Promise.resolve({ inserted:0, updated:0, skipped:sk, errors:[] });

  return fetchAllSessoesForPids(pids).then(function(existing){
    var sessaoByKey={};
    (existing||[]).forEach(function(s){
      if(!s||!s.pid) return;
      var k=sessaoMpIndexKey(s.pid, s.prof, s.data, s.est);
      sessaoByKey[k]=s;
    });
    return runWithMap(sessaoByKey);
  });
}

/** Resolve paciente/professor já gravados no Supabase (UUID) para criar sessões após importação. */
function resolvePatientRowForSeed(p){
  var row=null;
  if(p&&looksLikeUuid(p.id)){
    row=(ST.patients||[]).find(function(x){return String(x.id)===String(p.id);});
  }
  if(!row&&p) row=(ST.patients||[]).find(function(x){return normName(x.nome)===normName(p.nome);});
  if(!row||!looksLikeUuid(row.id)) return null;
  var profFk=String(row.prof||p.prof||'');
  if(!looksLikeUuid(profFk)){
    var pr=(ST.profs||[]).find(function(pr){
      return String(pr.id)===profFk||normName(pr.nome)===normName(profFk)||slugify(pr.nome)===slugify(profFk)||slugify(pr.nome)===String(profFk);
    });
    profFk=pr&&looksLikeUuid(pr.id)?pr.id:'';
  }
  if(!looksLikeUuid(profFk)) return null;
  var adm=(row.adm&&/^\d{4}-\d{2}-\d{2}$/.test(row.adm))?row.adm:((p.adm&&/^\d{4}-\d{2}-\d{2}$/.test(p.adm))?p.adm:'');
  var est=String(row.est!=null?row.est:p.est||'');
  var realNum=Math.max(0,parseInt(p.real,10)||0,parseInt(row.real,10)||0);
  return { id:row.id, prof:profFk, real:realNum, adm:adm, est:est };

/** Sincroniza presenças (P) em sessões com o campo real do paciente para o dashboard (P/F/taxa). */
function seedSessoesFromPatientReal(patients){
  var MAX_SYN = 260;
  var rows=[];
  patients.forEach(function(raw){
    var p = resolvePatientRowForSeed(raw);
    if(!p) return;
    var want = Math.min(MAX_SYN, Math.max(0, parseInt(p.real,10)||0));
    if(!want) return;
    var existingP = ST.sessoes.filter(function(s){ return String(s.pid)===String(p.id)&&String(s.status||'')==='P'; }).length;
    var need = want - existingP;
    if(need<=0) return;
    var base = (p.adm&&/^\d{4}-\d{2}-\d{2}$/.test(p.adm))?p.adm:today();
    for(var i=0;i<need;i++){
      rows.push({ id:newSessaoId(), pid:p.id, prof:p.prof, data:addDaysIso(base,existingP+i), status:'P', est:String(p.est||''), obs:'' });
    }
  });
  if(!rows.length) return Promise.resolve({ attempted:0, inserted:0, errors:[] });
  var chunkSize = 36;
  var inserted = 0;
  var errors = [];
  function sendChunk(start){
    if(start>=rows.length) return Promise.resolve();
    var slice = rows.slice(start, start+chunkSize);
    return Promise.all(slice.map(function(row){
      return sbIns('sessoes',row).then(function(){ inserted++; return true; }).catch(function(err){ errors.push(String(err&&err.message||err)); return null; });
    })).then(function(){ return sendChunk(start+chunkSize); });
  }
  return sendChunk(0).then(function(){ return { attempted:rows.length, inserted:inserted, errors:errors }; });
}
function parsePatientAgendaCell(raw){
  var text = cleanTxt(raw);
  if(!text || /n[aã]o preencher/i.test(text)) return null;
  var name = cleanTxt(text.split(/\s+-\s+/)[0]);
  var orig = (text.match(/\b(RE|VE|NISA|GT|GR)\b/i)||[])[1] || 'RE';
  var frac = text.match(/\b(\d{1,3})\s*\/\s*(\d{1,3})\s*(?:sess(?:ões|oes)?|s)\b/i);
  if(!frac) frac = text.match(/\b(\d{1,3})\s*\/\s*(\d{1,3})\s*s\b/i);
  if(!frac) frac = text.match(/\b(\d{1,3})\s+de\s+(\d{1,3})\s*(?:sess(?:ões|oes)?)?\b/i);
  var presc = 20;
  var realFromCell = 0;
  if(frac){
    realFromCell = parseInt(frac[1],10)||0;
    presc = parseInt(frac[2],10)||20;
  } else {
    presc = parseInt(((text.match(/(?:\/|\b)(\d{1,3})\s*s\b/i)||[])[1]||'20'),10) || 20;
  }
  var dates = [];
  String(text).replace(/\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/g, function(m){ dates.push(m); return m; });
  var altaDate = (text.match(/ALTA\s+(\d{1,2}\/\d{1,2}\/\d{2,4})/i)||[])[1] || '';
  var altaMonth = (text.match(/ALTA\s+(\d{1,2}\/\d{2,4})/i)||[])[1] || '';
  presc = Math.max(1, Math.min(500, presc));
  realFromCell = Math.min(Math.max(0, realFromCell), presc);
  return {
    nome:name,
    orig:String(orig).toUpperCase(),
    presc:presc,
    real:realFromCell,
    adm:dates[0]?isoFromBrDate(dates[0]):'',
    alta:altaDate?isoFromBrDate(altaDate):(altaMonth?isoFromMonthYear(altaMonth):''),
    obs:text
  };
}
function reportIndexFromSheet(wb, name){
  if(!wb.Sheets[name]) return {};
  var rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:''});
  var realizIdx=-1;
  if(rows.length){
    var hdr = rows[0]||[];
    for(var hi=0;hi<hdr.length;hi++){
      var H=cleanTxt(hdr[hi]).toLowerCase();
      if(/realiz|assist[\w\s]*sess|^freq|^sess[\w\s]*real|quant[\w\s]*sess[\w\s]*real|^real\b|presen[\w\s]*sess/i.test(H)) realizIdx=hi;
    }
  }
  var idx = {};
  rows.forEach(function(r, ri){
    if(realizIdx>=0&&ri===0) return;
    var patient = cleanTxt(r[3]);
    if(!patient){
      for(var ci=0;ci<Math.min((r||[]).length,12);ci++){
        var cand=cleanTxt(r[ci]);
        if(!cand||/paciente|^nome$/i.test(cand)) continue;
        if(/\d+\s*\/\s*\d+|\b(RE|VE|NISA)\b/i.test(cand)){ patient=cand; break; }
        if(normName(cand).length>6&&!/^[\d.\/\s:-]+$/.test(cand)){ patient=cand; break; }
      }
    }
    if(!patient || /^paciente$/i.test(patient)) return;
    var key = normName(patient);
    var tel=cleanTxt(r[4]), diag=cleanTxt(r[5]), obs=cleanTxt(r[9]);
    var entr={tel:tel, diag:diag, obs:obs};
    if(realizIdx>=0){
      var rv=parseInt(r[realizIdx],10);
      if(!isNaN(rv)&&rv>=0) entr.real=rv;
    }
    if(!idx[key]) idx[key]=entr;
    else idx[key]=Object.assign({},idx[key],entr);
  });
  return idx;
}
function extractEstColumns(headerRow, dataRows){
  var cols = [];

        patients.push({
          id:pid,

/** Preenche só o que falta no cadastro: não apaga telefone/diagnóstico já salvos com células vazias na planilha. */
function mergePatientImportGapFill(ex, fresh){

      ? Math.max(isNaN(prescEx) ? 0 : prescEx, isNaN(prescImp) ? 0 : prescImp)
      : 20
  ));

    tel: gapStr(ex.tel, fresh.tel),

    obs: gapObs(ex.obs, fresh.obs),
    cod_procedimento:(function(){

      var n = codImp == null ? '' : String(codImp).trim().replace(/\0/g, '');
      if(e && !n) return e.length > 12000 ? e.slice(0, 12000) : e;
      var s = n || e;
      if(s.length > 12000) s = s.slice(0, 12000);
      return s;
    })(),
    cid:(function(){
      var e = cidEx == null ? '' : String(cidEx).trim().replace(/\0/g, '');
      var n = cidImp == null ? '' : String(cidImp).trim().replace(/\0/g, '');
      if(e && !n) return e.length > 64 ? e.slice(0, 64) : e;
      var s = n || e;
      if(s.length > 64) s = s.slice(0, 64);
      return s;
    })()

}
function upsertPatientRecord(rec){
  var existing = ST.patients.find(function(p){return p.id===rec.id || normName(p.nome)===normName(rec.nome);});
  var profFk = rec.prof;
  if(!looksLikeUuid(profFk)){
    var pr=(ST.profs||[]).find(function(p){ return p.id===profFk || normName(p.nome)===normName(profFk); });
    if(pr&&looksLikeUuid(pr.id)) profFk=pr.id;
  }
  var fresh = {
    prof:profFk,
    nome:rec.nome,
    diag:rec.diag||'',
    orig:rec.orig != null && String(rec.orig).trim() !== '' ? String(rec.orig) : '',
    tel:rec.tel||'',
    adm:rec.adm||'',
    alta:rec.alta||'',
    presc:parseInt(rec.presc,10)||20,
    real:parseInt(rec.real,10)||0,
    est:rec.est||'',
    hor:rec.hor||'07:30',
    ativo:rec.ativo!==false,
    obs:rec.obs||'',
    cod_procedimento:(function(cp){
      var s = cp==null||cp===undefined ? '' : String(cp).trim().replace(/\0/g,'');
      if(s.length>12000) s = s.slice(0,12000);
      return s;
    })(rec.cod_procedimento),
    cid:(function(c){
      var s = c==null||c===undefined ? '' : String(c).trim().replace(/\0/g,'');
      if(s.length>64) s = s.slice(0,64);
      return s;
    })(rec.cid)
  };
  var base = existing && looksLikeUuid(existing.id) ? mergePatientImportGapFill(existing, fresh) : Object.assign({}, fresh, { orig: fresh.orig || 'RE' });
  if(!looksLikeUuid(base.prof)){
    return Promise.reject(new Error('Referência de professor inválida (prof). Sincronize ou confira se os professores foram gravados antes dos pacientes.'));
  }
  function syncState(stored){
    if(existing) ST.patients = ST.patients.map(function(p){return p.id===existing.id?stored:p;});
    else ST.patients.push(stored);
  }
  function patConflict(msg){
    var m = String(msg||'').toLowerCase();
    return m.indexOf('23505')>=0||m.indexOf('duplicate')>=0||m.indexOf('409')>=0||m.indexOf('conflict')>=0||m.indexOf('23503')>=0||m.indexOf('foreign')>=0;
  }
  function finalizeFromUpd(res, pivot, modelo){
    var merged = Object.assign({}, pivot, modelo);
    var row = firstSbRow(res);
    if(row) merged = Object.assign({}, merged, row);
    if(modelo.cod_procedimento!==undefined)
      merged.cod_procedimento = String(modelo.cod_procedimento);
    if(modelo.cid!==undefined)
      merged.cid = String(modelo.cid);
    syncState(merged);
  }
  function updPacienteComFallback(id, modelo, pivot){
    function patch(body){
      return sbUpd('pacientes',id,body).then(function(res){ finalizeFromUpd(res,pivot,modelo); }).catch(function(err){
        var msg = String((err&&err.message)||'');
        if(Object.prototype.hasOwnProperty.call(body,'cod_procedimento') && erroSchemaPacienteMissingColumn(msg,'cod_procedimento')){
          avisoUmaVezColunaCodProcedimento();
          var b = Object.assign({},body); delete b.cod_procedimento;
          return patch(b);
        }
        if(Object.prototype.hasOwnProperty.call(body,'cid') && erroSchemaPacienteMissingColumn(msg,'cid')){
          avisoPacienteSemColunaCid();
          var b = Object.assign({},body); delete b.cid;
          return patch(b);
        }
        if(erroSchemaPacienteSemCodProcedimento(msg) && Object.prototype.hasOwnProperty.call(body,'cod_procedimento')){
          avisoUmaVezColunaCodProcedimento();
          var b2 = pacientePayloadSemCodProcedimento(body);
          return patch(b2);
        }
        throw err;
      });
    }
    return patch(Object.assign({}, modelo));
  }
  function insPacienteComFallback(bodyOrig){
    function ins(body){
      return sbIns('pacientes',body).then(function(res){
        var row=firstSbRow(res);
        if(!row||!row.id) throw new Error('Supabase não devolveu o paciente criado.');
        var merged = Object.assign({},body,row);
        if(bodyOrig.cod_procedimento!==undefined) merged.cod_procedimento = String(bodyOrig.cod_procedimento);
        if(bodyOrig.cid!==undefined) merged.cid = String(bodyOrig.cid);
        syncState(merged);
      }).catch(function(err){
        var msg = String((err&&err.message)||'');
        if(Object.prototype.hasOwnProperty.call(body,'cod_procedimento') && erroSchemaPacienteMissingColumn(msg,'cod_procedimento')){
          avisoUmaVezColunaCodProcedimento();
          var b = Object.assign({},body); delete b.cod_procedimento;
          return ins(b);
        }
        if(Object.prototype.hasOwnProperty.call(body,'cid') && erroSchemaPacienteMissingColumn(msg,'cid')){
          avisoPacienteSemColunaCid();
          var b = Object.assign({},body); delete b.cid;
          return ins(b);
        }
        if(erroSchemaPacienteSemCodProcedimento(msg) && Object.prototype.hasOwnProperty.call(body,'cod_procedimento')){
          avisoUmaVezColunaCodProcedimento();
          return ins(pacientePayloadSemCodProcedimento(body));
        }
        throw err;
      });
    }
    return ins(Object.assign({}, bodyOrig));
  }
  function resolveDup(){
    return sbGet('pacientes').then(function(rows){
      var found=(rows||[]).find(function(p){
        return normName(p.nome)===normName(fresh.nome)&&(!fresh.prof||p.prof===fresh.prof);
      });
      if(!found||!looksLikeUuid(found.id)) throw new Error('Conflito ao gravar paciente; não encontrado no banco para atualizar.');
      return updPacienteComFallback(found.id, mergePatientImportGapFill(found, fresh), found);
    });
  }
  if(existing&&looksLikeUuid(existing.id)){
    return updPacienteComFallback(existing.id,base,existing);
  }
  var pid = existing?existing.id:rec.id;
  if(pid&&looksLikeUuid(pid)){
    return sbReq('GET','pacientes?id=eq.'+pid).then(function(rows){
      var list=Array.isArray(rows)?rows:[];
      if(list.length){
        return updPacienteComFallback(pid, mergePatientImportGapFill(list[0], fresh), list[0]);
      }
      return insPacienteComFallback(Object.assign({id:pid}, fresh, { orig: fresh.orig || 'RE' }));
    }).catch(function(err){
      if(!patConflict(err.message)) throw err;
      return resolveDup();
    });
  }
  var insPid = looksLikeUuid(rec.id) ? rec.id : newProfessorUuidIdx();
  return insPacienteComFallback(Object.assign({id:insPid}, fresh, { orig: fresh.orig || 'RE' })).catch(function(err){
    if(!patConflict(err.message)) throw err;
    return resolveDup();
  });
}

function confirmExcelImport(){
  var data = _pendingExcelImport;
  if(!data){ toast('Nenhuma importação pendente.', false); return; }
  closeDrawer();
  setLoading(true, 'Gravando professores e pacientes no sistema...');
  Promise.all([sbGet('professores'), sbGet('pacientes')]).then(function(prefetch){
    var prefetchRows = prefetch[0], prefetchPats = prefetch[1];
    ST.patients = Array.isArray(prefetchPats) ? prefetchPats : [];
    ST.profs = dedupeProfessores(Array.isArray(prefetchRows) ? prefetchRows : [], ST.patients);
    var importedProfs = [];
    return data.profs.reduce(function(promise, rec){
      return promise.then(function(){ return upsertProfRecord(rec).then(function(saved){ importedProfs.push(saved); }); });
    }, Promise.resolve()).then(function(){
    var profMap = {};
    importedProfs.forEach(function(saved,idx){
      var orig=data.profs[idx];
      if(orig&&orig.id) profMap[orig.id]=saved.id;
      profMap[saved.id]=saved.id;
      profMap[normName(saved.nome)]=saved.id;
    });
    data.patients.forEach(function(p){
      if(profMap[p.prof]) p.prof = profMap[p.prof];
      else {
        var match = importedProfs.find(function(ip){ return normName(ip.nome)===normName(p.prof); });
        if(match) p.prof = match.id;
      }
      if(!looksLikeUuid(p.prof)){
        var pi=data.profs.findIndex(function(o){ return o.id===p.prof; });
        if(pi>=0&&importedProfs[pi]&&looksLikeUuid(importedProfs[pi].id)) p.prof=importedProfs[pi].id;
      }
    });
    (data.mpAttendance||[]).forEach(function(m){
      if(profMap[m.prof]) m.prof = profMap[m.prof];
      else {
        var mmatch = importedProfs.find(function(ip){ return normName(ip.nome)===normName(m.prof); });
        if(mmatch) m.prof = mmatch.id;
      }
      if(!looksLikeUuid(m.prof)){
        var mpi=data.profs.findIndex(function(o){ return o.id===m.prof; });
        if(mpi>=0&&importedProfs[mpi]&&looksLikeUuid(importedProfs[mpi].id)) m.prof=importedProfs[mpi].id;
      }
    });
    var mpAttendance = data.mpAttendance||[];
    var mpNomeSet={}, mpPresenceByName={};
    mpAttendance.forEach(function(m){
      mpNomeSet[m.nomeNorm]=true;
      if(m.status==='P') mpPresenceByName[m.nomeNorm]=(mpPresenceByName[m.nomeNorm]||0)+1;
    });
    return data.patients.reduce(function(promise, rec){
      return promise.then(function(){ return upsertPatientRecord(rec); });
    }, Promise.resolve()).then(function(){
      setLoading(true, mpAttendance.length?('Gravando presen\u00e7as e faltas (abas MP)... '+mpAttendance.length+' c\u00e9lulas (consolidando no servidor)...'):'Gerando registros de sess\u00e3o para o painel...');
      return Promise.all([sbGet('pacientes'), sbGet('sessoes')]).then(function(res){
        ST.patients = Array.isArray(res[0])?res[0]:[];
        ST.sessoes = Array.isArray(res[1])?res[1]:[];
        function resolvePidProf(tpl){
          var pcur = (ST.patients||[]).find(function(x){ return normName(x.nome)===tpl.nomeNorm; });
          if(!pcur||!looksLikeUuid(pcur.id)) return null;
          var profFk = looksLikeUuid(tpl.prof)? tpl.prof : pcur.prof;
          if(!looksLikeUuid(profFk)) return null;
          return { pid:pcur.id, prof:profFk };
        }
        return upsertMpSessoesImported(mpAttendance, resolvePidProf).then(function(mpSeedRes){
          data._mpSeed = mpSeedRes||{};
          setLoading(true, 'Sincronizando campo realizado e painel...');
          return sbGet('sessoes').then(function(sessRows){
            ST.sessoes = Array.isArray(sessRows)?sessRows:[];
            return sbGet('pacientes').then(function(patRows){
              ST.patients = Array.isArray(patRows)?patRows:[];
              var nameSet={};
              data.patients.forEach(function(p){ nameSet[normName(p.nome)]=true; });
              var impReal={};
              data.patients.forEach(function(p){

                  impReal[k]=mpPresenceByName[k]||0;

                if(r>(impReal[k]||0)) impReal[k]=r;
              });
              var pendingReal=[];
              ST.patients.forEach(function(p){
                if(!nameSet[normName(p.nome)]) return;
                var ir=impReal[normName(p.nome)];
                if(ir==null||isNaN(parseInt(ir,10))) return;
                var dbR=parseInt(p.real,10)||0;
                var prescCap=Math.max(1,Math.min(500,parseInt(p.presc,10)||20));
                var target=Math.min(Math.max(0,parseInt(ir,10)||0),prescCap);
                if(looksLikeUuid(p.id)&&target!==dbR)
                  pendingReal.push(sbUpd('pacientes',p.id,{real:target}).catch(function(){ return null; }));
              });
              return Promise.all(pendingReal).then(function(){
                return pendingReal.length?sbGet('pacientes'):Promise.resolve(ST.patients);
              }).then(function(rowsPat){
                if(pendingReal.length) ST.patients = Array.isArray(rowsPat)?rowsPat:[];
                var subset = ST.patients.filter(function(p){ return nameSet[normName(p.nome)]; }).map(function(p){
                  var k=normName(p.nome);
                  var ir=impReal[k];
                  var prescCap=Math.max(1,Math.min(500,parseInt(p.presc,10)||20));
                  if(ir!=null&&!isNaN(parseInt(ir,10)))
                    return Object.assign({},p,{ real:Math.min(Math.max(0,parseInt(ir,10)||0),prescCap) });
                  return p;
                }).filter(function(p){ return !mpNomeSet[normName(p.nome)]; });
                return seedSessoesFromPatientReal(subset);
              });
            });
          });
        });
      }).then(function(seedRes){
        return sbGet('sessoes').then(function(sessRows){
          ST.sessoes = Array.isArray(sessRows)?sessRows:[];
          data._sessoesSeed = seedRes||{};
          data._sessoesGeradas = seedRes&&seedRes.inserted!=null?seedRes.inserted:(seedRes&&seedRes.attempted)||0;
          return data;
        });
      });
    });
    });
  }).then(function(result){
    return sbGet('professores').then(function(rows){
      ST.profs = dedupeProfessores(Array.isArray(rows)?rows:[], ST.patients||[]);
      return result;
    });
  }).then(function(result){
    _pendingExcelImport = null;
    if(_pendingImportFileHash){
      rememberImportFileHash(_pendingImportFileHash);
      _pendingImportFileHash = null;
    }
    setLoading(false);
    renderHeader();
    renderAlerts();
    go(ST.tab);
    var msg = 'Importação concluída: '+result.profs.length+' professor(es) e '+result.patients.length+' paciente(s).';
    var sr = result._sessoesSeed||{};
    var mr = result._mpSeed||{};
    if(mr.inserted||mr.updated) msg += ' Abas MP: '+((mr.inserted||0)+(mr.updated||0))+' sess\u00f5es gravadas ou atualizadas.';
    if((mr.skipped||0)>0) msg += ' ('+(mr.skipped||0)+' célula(s) sem paciente correspondente.)';
    if(sr.inserted) msg += ' Foram gravadas '+sr.inserted+' presença(s) sintéticas (Agenda) para o painel.';
    else if(sr.attempted>0&&(!sr.errors||!sr.errors.length)) msg += ' Sessões da Agenda já batiam com realizadas informadas.';
    var errLine = (mr.errors&&mr.errors[0])||(sr.errors&&sr.errors[0])||'';
    if(errLine) msg += ' — aviso: '+errLine;
    toast(msg, errLine?false:undefined);
  }).catch(function(err){
    setLoading(false);
    toast('Erro na importação: '+err.message, false);
  });
}
function handleExcelImport(ev){
  var file = ev && ev.target && ev.target.files && ev.target.files[0];
  if(!file) return;
  if(typeof XLSX === 'undefined'){ toast('Leitor de Excel não carregou.', false); return; }
  setLoading(true, 'Lendo planilha e preparando importação...');
  var reader = new FileReader();
  reader.onload = function(e){
    var buf = e.target.result;
    hashExcelImportBuffer(buf).then(function(hash){
      function proceed(){
        setLoading(true, 'Lendo planilha e preparando importação...');
        Promise.resolve().then(function(){
          var wb = XLSX.read(buf, {type:'array', cellDates:true});
          return buildSaasImportFromWorkbook(wb);
        }).then(function(data){
          setLoading(false);
          _pendingExcelImport = data;
          _pendingImportFileHash = hash;
          openDrawer('Importar Excel', renderImportPreview(data, file.name), '#0d9488');
        }).catch(function(err){
          setLoading(false);
          _pendingImportFileHash = null;
          toast('Erro na importação: '+err.message, false);
        });
      }
      if(isDuplicateImportFile(hash)){
        setLoading(false);
        showCfm('Este arquivo já foi importado antes (mesmo conteúdo). Importar de novo pode repetir operações na grade. Deseja continuar?', proceed);
        return;
      }
      proceed();
    }).catch(function(){
      setLoading(false);
      toast('Não foi possível validar o arquivo.', false);
    });
  };
  reader.onerror = function(){ setLoading(false); toast('Não foi possível ler o arquivo.', false); };
  reader.readAsArrayBuffer(file);
}

function loadAll() {
  if(DATA) return DATA.loadAll();
  if(!hasSupabaseConfig()) {
    setLoading(true, configMissingHelpHtml());
    return;
  }
  ST.session = getSession();
  if(!ST.session || !ST.session.access_token) {
    setLoading(false);
    document.getElementById('auth').classList.add('on');
    return;
  }
  if(sessionExpired(ST.session)) {
    setLoading(true, 'Renovando sess\u00e3o...');
    return refreshSession().then(loadAll).catch(function(){
      authLogout();
      authMessage('Sess\u00e3o expirada. Entre novamente.', false);
    });
  }
  document.getElementById('auth').classList.remove('on');
  setLoading(true, 'Conectando ao banco de dados...');
  Promise.all([sbGet('professores'), sbGet('pacientes'), sbGet('sessoes')])
    .then(function(res) {
      ST.profs    = dedupeProfessores(res[0], res[1]);
      ST.patients = res[1];
      ST.sessoes  = res[2];
      setLoading(false);
      renderHeader();
      renderAlerts();
      go(ST.tab);
    })
    .catch(function(e) {
      setLoading(true,
        '\u274c Erro ao conectar ao Supabase<br><br>' +
        '<span style="color:#64748b;font-size:12px">Verifique se o SQL foi executado no Supabase.<br>Erro: '+esc(e.message)+'</span><br><br>' +
        '<button onclick="loadAll()" style="background:#0d9488;color:#ffffff;border:none;padding:10px 20px;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit">\ud83d\udd04 Tentar novamente</button>'
      );
    });
}

function hdrPeriodoDia(){

}

function hdrContextCopyForDash(d){
  d=d||{};
  var tips=[
    'Dica: parceira e curso refinam todas as métricas abaixo.',
    'Pacientes aparecem ativos só se t\u00eam sess\u00e3o registrada neste m\u00eas.',
    'Depois da agenda ou da importação, atualize dados para ver o reflexo aqui.',
    'Combine alertas de tratamento (\u226580%) com prazo RE/VE na barra amarela.'
  ];
  var tipIdx=(Math.floor(Date.now()/86400000))%tips.length;
  var hasSessoes=(ST.sessoes||[]).length>0;
  if(!d.total&&hasSessoes) return 'Nenhuma sess\u00e3o neste m\u00eas no escopo — ajuste filtros ou a compet\u00eancia.';
  if(!d.total) return hdrPeriodoDia()+' \u2014 marque sess\u00f5es na agenda ou importe a planilha para encher o painel.';
  if((d.alertSum||0)>0) return String(d.alertSum)+' paciente(s) em alerta de alta no escopo atual.';
  if((d.taxa||0)>=80) return hdrPeriodoDia()+' — ades\u00e3o '+Math.round(d.taxa)+'%. '+String(d.adLbl||'')+' Ritmo forte.';
  if((d.taxa||0)<60) return 'Ades\u00e3o em '+Math.round(d.taxa||0)+'% \u2014 vale revisar faltas e reagendas.';
  return hdrPeriodoDia()+' \u2022 '+tips[tipIdx];
}

// \u2500\u2500 DASHBOARD \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
var dashProf = null;
/** null = todas as origens; 'VE' | 'RE' filtram métricas e lista no painel */
var dashOrig = null;
/** Compet\u00eancia (YYYY-MM) do painel: m\u00e9tricas e listas pelo calend\u00e1rio de sess\u00f5es. */
var dashMes = today().slice(0, 7);
/** Meses disponíveis no select: intervalo contínuo entre o menor e maior YYYY-MM
 *  vindos de sessões, datas de admissão, mês atual e competência escolhida — evita
 *  sumir meses só porque não há sessão naquele mês. */
function dashListaMesesSelect(){
  function cmpYm(a,b){
    var sa=String(a), sb=String(b);
    if(sa<sb) return -1;
    if(sa>sb) return 1;
    return 0;
  }
  function addMonthYm(ym){
    var y=parseInt(ym.slice(0,4),10), m=parseInt(ym.slice(5,7),10)||1;
    m+=1;
    if(m>12){ m=1; y++; }
    return y+'-'+String(m).padStart(2,'0');
  }
  var set={};
  (ST.sessoes||[]).forEach(function(s){
    var d=s&&s.data;
    if(!d||String(d).length<7) return;
    set[String(d).slice(0,7)]=true;
  });
  (ST.patients||[]).forEach(function(p){
    if(p.adm && /^\d{4}-\d{2}/.test(String(p.adm))) set[p.adm.slice(0,7)]=true;
  });
  var hoje=today().slice(0,7);
  set[hoje]=true;
  set[dashMes]=true;
  var keys=Object.keys(set).filter(Boolean);
  keys.sort(cmpYm);
  if(keys.length===0) return [hoje];
  var minYm=keys[0], maxYm=keys[keys.length-1];
  [hoje,dashMes].forEach(function(m){
    if(!m)return;
    if(cmpYm(m,minYm)<0) minYm=m;
    if(cmpYm(m,maxYm)>0) maxYm=m;
  });
  var out=[], cur=minYm;
  for(var guard=0;guard<240;guard++){
    out.push(cur);
    if(cur===maxYm) break;
    cur=addMonthYm(cur);
  }
  out.sort(function(a,b){return cmpYm(b,a);});
  return out;
}
function dashMesTitulo(mm){
  mm = mm!=null&&mm!==undefined ? mm : dashMes;
  var p = String(mm||'').split('-');
  if(p.length!==2) return String(mm||'');
  var mi = parseInt(p[1],10)-1;
  return (mi>=0&&mi<12?MESES_PT[mi]:p[1])+' / '+p[0];
}
function sessaoNoMesDashboard(s,mm){
  if(mm===undefined||mm===null) mm=dashMes;
  var d=s&&s.data;
  if(!d||String(d).length<7) return false;
  return String(d).slice(0,7)===String(mm).slice(0,7);
}
/** Paciente com pelo menos uma sess\u00e3o neste supervisor na compet\u00eancia ym (YYYY-MM). */
function pacienteTemRegistroMes(profId, pacId, ym){
  ym=ym||dashMes;
  if(!profId||pacId==null||pacId===''||!ym) return false;
  var pmap={};
  (ST.patients||[]).forEach(function(px){
    pmap[px.id]=px;
    pmap[String(px.id)]=px;
  });
  var pac=pacientePorIdMap(pmap,pacId);
  if(!pac) return false;
  var spp=String(profId);
  var spi=String(pac.id);
  for(var i=0;i<(ST.sessoes||[]).length;i++){
    var s=ST.sessoes[i];
    if(String(s.prof||'')!==spp) continue;
    if(String(s.pid||'')!==spi) continue;
    if(!sessaoNoMesDashboard(s,ym)) continue;
    if(!sessaoProfConferePaciente(s,pmap)) continue;
    return true;
  }
  return false;
}
/** Select mensal destacado na faixa sob o dashboard. */
function htmlDashMesSelect(){
  var h='<select aria-label="Compet\u00eancia (m\u00eas de refer\u00eancia)" class="dash-mes-select" onchange="dashMes=this.value; redrawAposFiltroMeta(); renderHeader();">';
  dashListaMesesSelect().forEach(function(m){

}
/** Filtros globais por instituição parceira e curso de preceptoria (várias telas) */
var filtroParceira = null;
var filtroCursoPreceptoria = null;
function profMetaMatch(p){
  if(!p) return false;
  if(filtroParceira && normName(cleanTxt(p.instituicao_parceira||''))!==normName(filtroParceira)) return false;
  if(filtroCursoPreceptoria && normName(cleanTxt(p.curso_preceptoria||''))!==normName(filtroCursoPreceptoria)) return false;
  return true;
}

function reconciliarEscopoAposFiltroMeta(){

  if(pacsProfF!=='TODOS'&&!plist.some(function(x){return x.id===pacsProfF;})) pacsProfF='TODOS';
}

function htmlBarraFiltrosParceiraCurso(opts){
  opts=opts||{};
  var compact=!!opts.compact;
  var par=uniqParceirasDosProfs();
  var curs=uniqCursosDosProfs();
  if(!par.length&&!curs.length) return '';
  var mh=compact?'10px':'12px';
  var h='<div class="card" style="padding:'+(compact?'10px 14px':'14px 16px')+';margin-bottom:'+mh+'">';
  h+='<div style="font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">\ud83c\udfeb Parceira \u00b7 curso de preceptoria</div>';
  h+='<div style="font-size:11px;color:#94a3b8;margin-bottom:8px;line-height:1.45">Filtros alinhados ao <b>cadastro em Ajustes</b>: s\u00f3 aparecem parceiras e cursos que voc\u00ea registrou l\u00e1. Professores tamb\u00e9m escolhem nessas listas.</div>';
  h+='<div style="font-size:10px;color:#64748b;font-weight:700;margin:6px 0 5px">INSTITUI\u00c7\u00c3O / EMPRESA</div>';

  h+='<button type="button" class="dash-chip'+(!filtroParceira?' is-on':'')+'" onclick="setFiltroParceiraCtx(null)">Todas</button>';
  par.forEach(function(x){
    var on=normName(x)===normName(filtroParceira||'');
    h+='<button type="button" class="dash-chip'+(on?' is-on':'')+'" onclick="setFiltroParceiraCtx('+jsVal(x)+')">'+esc(x)+'</button>';
  });
  h+='</div>';
  h+='<div style="font-size:10px;color:#64748b;font-weight:700;margin:6px 0 5px">CURSO / \u00c1REA DO EST\u00c1GIO</div>';
  h+='<div class="dash-chip-scroll">';
  h+='<button type="button" class="dash-chip'+(!filtroCursoPreceptoria?' is-on':'')+'" onclick="setFiltroCursoCtx(null)">Todos</button>';
  curs.forEach(function(x){
    var on=normName(x)===normName(filtroCursoPreceptoria||'');
    h+='<button type="button" class="dash-chip'+(on?' is-on':'')+'" onclick="setFiltroCursoCtx('+jsVal(x)+')">'+esc(x)+'</button>';
  });
  h+='</div>';
  if(filtroParceira||filtroCursoPreceptoria) h+='<div style="margin-top:10px"><button type="button" class="btn bd bsm" onclick="limparFiltrosMeta()">Limpar filtros de parceira/curso</button></div>';
  h+='</div>';
  return h;
}
function renderDash() {
  function profIdsEscopoPainel(){
    return ST.profs.filter(function(p){
      if(!profMetaMatch(p)) return false;
      if(dashProf && p.id!==dashProf) return false;
      return true;
    }).map(function(p){ return p.id; });
  }
  function idMapEscopoPainel(){
    var o={}, ids=profIdsEscopoPainel();
    ids.forEach(function(i){ o[i]=true; });
    return o;
  }
  function statsPainel(){
    var patMap={}, ids=idMapEscopoPainel();
    (ST.patients||[]).forEach(function(p){ patMap[p.id]=p; });
    function patientInScope(p){
      if(!ids[p.prof]) return false;
      if(dashOrig && String(p.orig||'').toUpperCase()!==dashOrig) return false;
      return true;
    }
    var psCand = ST.patients.filter(patientInScope);
    var pidOk = {};
    psCand.forEach(function(p){ pidOk[p.id]=true; });
    var ss = ST.sessoes.filter(function(s){
      if(!ids[s.prof]) return false;
      if(!sessaoNoMesDashboard(s)) return false;
      if(!sessaoProfConferePaciente(s,patMap)) return false;
      if(dashOrig && !pidOk[s.pid]) return false;
      return true;
    });
    var pidComSessao = {};
    ss.forEach(function(s){ pidComSessao[s.pid]=true; });
    var ps = psCand.filter(function(p){ return pidComSessao[p.id]; });
    var P=0,F=0,FJ=0;
    ss.forEach(function(s){ if(s.status==='P')P++; else if(s.status==='F')F++; else if(s.status==='FJ')FJ++; });
    var taxa = ss.length ? Math.round(P/ss.length*100) : 0;
    var ativos = ps.filter(function(p){return p.ativo;}).length;
    var alertas = ps.filter(function(p){return p.ativo&&p.presc>0&&pct(p.real,p.presc)>=80;}).length;
    var alertasTempo = ps.filter(function(p){return pacienteEmAlertaAltaTemporal(p);}).length;
    return {ativos:ativos, P:P, F:F, FJ:FJ, taxa:taxa, alertas:alertas, alertasTempo:alertasTempo, total:ss.length};
  }
  function statsSingleProf(pid){
    var patMap={};
    (ST.patients||[]).forEach(function(p){ patMap[p.id]=p; });
    function patientInScope(p){
      if(p.prof!==pid) return false;
      if(dashOrig && String(p.orig||'').toUpperCase()!==dashOrig) return false;
      return true;
    }
    var psCand = ST.patients.filter(patientInScope);
    var pidOk = {};
    psCand.forEach(function(p){ pidOk[p.id]=true; });
    var ss = ST.sessoes.filter(function(s){
      if(s.prof!==pid) return false;
      if(!sessaoNoMesDashboard(s)) return false;
      if(!sessaoProfConferePaciente(s,patMap)) return false;
      if(dashOrig && !pidOk[s.pid]) return false;
      return true;
    });
    var pidComSessao = {};
    ss.forEach(function(s){ pidComSessao[s.pid]=true; });
    var ps = psCand.filter(function(p){ return pidComSessao[p.id]; });
    var P=0,F=0,FJ=0;
    ss.forEach(function(s){ if(s.status==='P')P++; else if(s.status==='F')F++; else if(s.status==='FJ')FJ++; });
    var taxa = ss.length ? Math.round(P/ss.length*100) : 0;
    var ativos = ps.filter(function(p){return p.ativo;}).length;
    var alertas = ps.filter(function(p){return p.ativo&&p.presc>0&&pct(p.real,p.presc)>=80;}).length;
    var alertasTempo = ps.filter(function(p){return pacienteEmAlertaAltaTemporal(p);}).length;
    return {ativos:ativos, P:P, F:F, FJ:FJ, taxa:taxa, alertas:alertas, alertasTempo:alertasTempo, total:ss.length};
  }
  function patientsAtivosEscopoProf(){
    var patMap={}, ids=idMapEscopoPainel();
    (ST.patients||[]).forEach(function(p){ patMap[p.id]=p; });
    var pidMes={};
    ST.sessoes.forEach(function(s){
      if(!sessaoNoMesDashboard(s)) return;
      if(!ids[s.prof]) return;
      if(!sessaoProfConferePaciente(s,patMap)) return;
      pidMes[s.pid]=true;
    });
    return ST.patients.filter(function(p){
      if(!p.ativo) return false;
      if(!ids[p.prof]) return false;
      return !!pidMes[p.id];
    });
